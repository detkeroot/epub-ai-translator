<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EPUB AI Translator</title>
    <style>
/* Source: css/styles.css */
/* ========================================
   EPUB AI Translator - Styles
   ======================================== */

:root {
    --primary-color: #4a90d9;
    --primary-hover: #357abd;
    --success-color: #28a745;
    --success-hover: #218838;
    --warning-color: #ffc107;
    --warning-hover: #e0a800;
    --danger-color: #dc3545;
    --danger-hover: #c82333;
    --bg-color: #1a1a2e;
    --bg-secondary: #16213e;
    --bg-tertiary: #0f3460;
    --text-color: #e8e8e8;
    --text-muted: #a0a0a0;
    --border-color: #2d3748;
    --shadow-color: rgba(0, 0, 0, 0.3);
    --panel-bg: #1e2744;
    --input-bg: #2d3a5a;
    --input-border: #3d4a6a;
    --scrollbar-track: #1a1a2e;
    --scrollbar-thumb: #4a5568;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
    background: var(--bg-color);
    color: var(--text-color);
    min-height: 100vh;
    min-height: 100dvh;
    line-height: 1.5;
    overflow-x: hidden;
}

/* Scrollbar */
::-webkit-scrollbar {
    width: 8px;
    height: 8px;
}

::-webkit-scrollbar-track {
    background: var(--scrollbar-track);
}

::-webkit-scrollbar-thumb {
    background: var(--scrollbar-thumb);
    border-radius: 4px;
}

::-webkit-scrollbar-thumb:hover {
    background: #5a6578;
}

/* ========================================
   Layout
   ======================================== */

#app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    max-height: 100vh;
    max-height: 100dvh;
    overflow: hidden;
}

.app-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0.75rem 1.5rem;
    background: var(--bg-secondary);
    border-bottom: 1px solid var(--border-color);
    flex-shrink: 0;
}

.app-header h1 {
    font-size: 1.5rem;
    font-weight: 600;
}

.header-actions {
    display: flex;
    gap: 0.5rem;
}

.app-main {
    display: flex;
    flex: 1;
    overflow: hidden;
    gap: 1px;
    background: var(--border-color);
}

.app-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0.5rem 1.5rem;
    background: var(--bg-secondary);
    border-top: 1px solid var(--border-color);
    font-size: 0.85rem;
    color: var(--text-muted);
    flex-shrink: 0;
}

/* ========================================
   Panels
   ======================================== */

.panel {
    background: var(--panel-bg);
    overflow-y: auto;
    display: flex;
    flex-direction: column;
}

.panel-left {
    width: 280px;
    min-width: 200px;
    flex-shrink: 0;
}

.panel-center {
    flex: 1;
    min-width: 400px;
}

.panel-right {
    width: 350px;
    min-width: 280px;
    flex-shrink: 0;
}

.panel-section {
    padding: 1rem;
    border-bottom: 1px solid var(--border-color);
}

.panel-section h3 {
    font-size: 1rem;
    margin-bottom: 0.75rem;
    color: var(--text-color);
}

/* ========================================
   Buttons
   ======================================== */

.btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    padding: 0.5rem 1rem;
    border: none;
    border-radius: 6px;
    font-size: 0.9rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s ease;
    background: var(--bg-tertiary);
    color: var(--text-color);
}

.btn:hover {
    background: var(--primary-color);
}

.btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

.btn:disabled:hover {
    background: var(--bg-tertiary);
}

.btn-primary {
    background: var(--primary-color);
}

.btn-primary:hover {
    background: var(--primary-hover);
}

.btn-success {
    background: var(--success-color);
    color: #fff;
}

.btn-success:hover {
    background: var(--success-hover);
}

.btn-warning {
    background: var(--warning-color);
    color: #000;
}

.btn-warning:hover {
    background: var(--warning-hover);
}

.btn-danger {
    background: var(--danger-color);
    color: #fff;
}

.btn-danger:hover {
    background: var(--danger-hover);
}

.btn-small {
    padding: 0.35rem 0.75rem;
    font-size: 0.8rem;
}

.btn-large {
    padding: 0.75rem 1.5rem;
    font-size: 1rem;
}

.btn-icon {
    padding: 0.5rem;
    font-size: 1.2rem;
    background: transparent;
}

.btn-icon:hover {
    background: var(--bg-tertiary);
}

/* ========================================
   Forms
   ======================================== */

.form-group {
    margin-bottom: 1rem;
}

.form-group label {
    display: block;
    margin-bottom: 0.35rem;
    font-size: 0.85rem;
    color: var(--text-muted);
}

.form-row {
    display: flex;
    gap: 1rem;
}

.form-row .form-group {
    flex: 1;
}

input[type="text"],
input[type="number"],
input[type="password"],
textarea,
select {
    width: 100%;
    padding: 0.5rem 0.75rem;
    border: 1px solid var(--input-border);
    border-radius: 6px;
    background: var(--input-bg);
    color: var(--text-color);
    font-size: 0.9rem;
    font-family: inherit;
}

input:focus,
textarea:focus,
select:focus {
    outline: none;
    border-color: var(--primary-color);
    box-shadow: 0 0 0 2px rgba(74, 144, 217, 0.2);
}

textarea {
    resize: vertical;
    min-height: 60px;
}

input[type="range"] {
    width: 100%;
    cursor: pointer;
}

.checkbox-group,
.checkbox-label {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    cursor: pointer;
}

.checkbox-label input[type="checkbox"] {
    width: auto;
    cursor: pointer;
}

.options-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 0.5rem;
    margin-bottom: 1rem;
}

.prompt-header {
    display: flex;
    gap: 0.5rem;
    margin-bottom: 0.5rem;
}

.prompt-header select {
    flex: 1;
}

/* Thinking Mode Options */
.thinking-options {
    background: var(--bg-tertiary);
    border-radius: 6px;
    padding: 0.75rem;
    margin-top: 0.5rem;
}

.thinking-budget-wrapper {
    margin-top: 0.5rem;
    padding-left: 1.5rem;
}

.thinking-budget-wrapper .hint {
    font-size: 0.75rem;
    color: var(--text-muted);
    margin-left: 0.5rem;
}

.thinking-budget-wrapper input {
    width: 120px;
    display: inline-block;
}

/* ========================================
   File Drop Zone
   ======================================== */

.file-drop-zone {
    border: 2px dashed var(--border-color);
    border-radius: 8px;
    padding: 1.5rem;
    text-align: center;
    transition: all 0.2s ease;
    background: var(--input-bg);
}

.file-drop-zone.drag-over {
    border-color: var(--primary-color);
    background: rgba(74, 144, 217, 0.1);
}

.file-drop-zone p {
    margin: 0.5rem 0;
    color: var(--text-muted);
    font-size: 0.9rem;
}

.file-info {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.75rem;
    background: var(--input-bg);
    border-radius: 6px;
    margin-top: 0.75rem;
}

.file-info span {
    font-size: 0.9rem;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

/* ========================================
   Chapter Ranges - НОВЫЕ СТИЛИ (замена старых)
   ======================================== */

.chapter-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 10px 0 15px 0;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border-color);
}

.chapter-info {
    font-size: 14px;
    color: var(--text-muted);
    font-weight: 500;
}

.chapter-ranges {
    display: flex;
    flex-direction: column;
    gap: 12px;
    max-height: 400px;
    overflow-y: auto;
    padding-right: 5px;
}

.chapter-range {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 15px;
    border: 1px solid var(--border-color);
    border-radius: 8px;
    background: var(--input-bg);
    transition: all 0.2s ease;
    box-shadow: 0 2px 4px var(--shadow-color);
}

.chapter-range:hover {
    border-color: var(--primary-color);
    background: rgba(74, 144, 217, 0.1);
    box-shadow: 0 4px 12px rgba(74, 144, 217, 0.2);
}

.range-controls {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
}

.range-group {
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 1;
    min-width: 0;
}

.range-label {
    font-weight: 600;
    color: var(--text-color);
    white-space: nowrap;
    min-width: 35px;
    font-size: 13px;
}

.chapter-select {
    flex: 1;
    padding: 10px 12px;
    border: 2px solid var(--input-border);
    border-radius: 6px;
    font-size: 14px;
    background: var(--input-bg);
    color: var(--text-color);
    cursor: pointer;
    transition: all 0.2s ease;
    min-height: 42px;
}

.chapter-select:hover {
    border-color: var(--primary-color);
}

.chapter-select:focus {
    outline: none;
    border-color: var(--primary-color);
    box-shadow: 0 0 0 3px rgba(74, 144, 217, 0.2);
}

.chapter-select option {
    padding: 8px;
    background: var(--bg-color);
    color: var(--text-color);
}

.btn-remove-range {
    flex-shrink: 0;
    width: 42px;
    height: 42px;
    padding: 0;
    border: 2px solid var(--danger-color);
    background: var(--input-bg);
    color: var(--danger-color);
    font-size: 18px;
    font-weight: bold;
    border-radius: 6px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s ease;
}

.btn-remove-range:hover {
    background: var(--danger-color);
    color: #fff;
    transform: scale(1.05);
}

.btn-remove-range:active {
    transform: scale(0.98);
}

/* ========================================
   Control & Progress
   ======================================== */

.control-buttons {
    display: flex;
    gap: 0.75rem;
    padding: 1rem;
    justify-content: center;
}

.progress-section {
    padding: 1rem;
    background: var(--bg-secondary);
    border-radius: 8px;
    margin: 0 1rem 1rem;
}

.progress-bar {
    height: 20px;
    background: var(--input-bg);
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 0.5rem;
}

.progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--primary-color), var(--success-color));
    transition: width 0.3s ease;
    width: 0%;
}

.progress-text {
    text-align: center;
    font-size: 0.9rem;
    color: var(--text-muted);
}

/* ========================================
   Tabs
   ======================================== */

.tabs {
    display: flex;
    border-bottom: 1px solid var(--border-color);
    background: var(--bg-secondary);
}

.tab-btn {
    flex: 1;
    padding: 0.75rem;
    background: transparent;
    border: none;
    border-bottom: 2px solid transparent;
    color: var(--text-muted);
    font-size: 0.85rem;
    cursor: pointer;
    transition: all 0.2s ease;
}

.tab-btn:hover {
    color: var(--text-color);
    background: var(--bg-tertiary);
}

.tab-btn.active {
    color: var(--primary-color);
    border-bottom-color: var(--primary-color);
}

.tab-content {
    display: none;
    flex: 1;
    overflow-y: auto;
    padding: 1rem;
}

.tab-content.active {
    display: flex;
    flex-direction: column;
}

/* ========================================
   Glossary
   ======================================== */

.glossary-actions {
    display: flex;
    gap: 0.5rem;
    margin-bottom: 0.75rem;
    flex-wrap: wrap;
}

.glossary-search {
    margin-bottom: 0.75rem;
}

.glossary-list {
    flex: 1;
    overflow-y: auto;
    border: 1px solid var(--border-color);
    border-radius: 6px;
    background: var(--input-bg);
}

.glossary-item {
    display: flex;
    align-items: flex-start;
    padding: 0.75rem;
    border-bottom: 1px solid var(--border-color);
    gap: 0.5rem;
}

.glossary-item:last-child {
    border-bottom: none;
}

.glossary-item-content {
    flex: 1;
    min-width: 0;
}

.glossary-original {
    font-weight: 600;
    color: var(--primary-color);
    margin-bottom: 0.25rem;
}

.glossary-translation {
    font-size: 0.9rem;
}

.glossary-note {
    font-size: 0.8rem;
    color: var(--text-muted);
    margin-top: 0.25rem;
    font-style: italic;
}

.glossary-item-actions {
    display: flex;
    gap: 0.25rem;
}

.glossary-item-actions button {
    padding: 0.25rem 0.5rem;
    font-size: 0.75rem;
}

.glossary-stats {
    padding: 0.75rem;
    text-align: center;
    color: var(--text-muted);
    font-size: 0.85rem;
    border-top: 1px solid var(--border-color);
}

/* ========================================
   Logs
   ======================================== */

.logs-actions {
    display: flex;
    gap: 0.5rem;
    margin-bottom: 0.75rem;
    align-items: center;
}

.logs-actions .checkbox-label {
    margin-left: auto;
    font-size: 0.8rem;
}

.log-container {
    flex: 1;
    overflow-y: auto;
    font-family: 'Consolas', 'Monaco', monospace;
    font-size: 0.8rem;
    background: #0d1117;
    border-radius: 6px;
    padding: 0.75rem;
    line-height: 1.6;
}

.log-entry {
    margin-bottom: 0.25rem;
    word-break: break-word;
}

.log-entry.info { color: #58a6ff; }
.log-entry.success { color: #3fb950; }
.log-entry.warning { color: #d29922; }
.log-entry.error { color: #f85149; }
.log-entry.debug { color: #8b949e; }

.log-separator {
    border-top: 1px dashed var(--border-color);
    margin: 0.5rem 0;
}

/* ========================================
   Results
   ======================================== */

.results-actions {
    display: flex;
    gap: 0.5rem;
    margin-bottom: 0.75rem;
}

.results-list {
    flex: 1;
    overflow-y: auto;
}

.result-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.75rem;
    background: var(--input-bg);
    border-radius: 6px;
    margin-bottom: 0.5rem;
}

.result-item-name {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 0.9rem;
}

.result-item-actions {
    display: flex;
    gap: 0.5rem;
}

/* ========================================
   Modal
   ======================================== */

.modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.7);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    padding: 2rem;
}

.modal {
    background: var(--panel-bg);
    border-radius: 12px;
    box-shadow: 0 20px 60px var(--shadow-color);
    max-width: 500px;
    width: 100%;
    max-height: 80vh;
    display: flex;
    flex-direction: column;
}

.modal-large {
    max-width: 800px;
}

.modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 1rem 1.5rem;
    border-bottom: 1px solid var(--border-color);
}

.modal-header h3 {
    font-size: 1.1rem;
}

.btn-close {
    background: transparent;
    border: none;
    font-size: 1.5rem;
    color: var(--text-muted);
    cursor: pointer;
    line-height: 1;
    padding: 0.25rem;
}

.btn-close:hover {
    color: var(--text-color);
}

.modal-body {
    padding: 1.5rem;
    overflow-y: auto;
    flex: 1;
}

.modal-body pre {
    background: #0d1117;
    padding: 1rem;
    border-radius: 6px;
    overflow-x: auto;
    font-size: 0.8rem;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-word;
}

.modal-footer {
    display: flex;
    justify-content: flex-end;
    gap: 0.75rem;
    padding: 1rem 1.5rem;
    border-top: 1px solid var(--border-color);
}

/* ========================================
   Utilities
   ======================================== */

.hidden {
    display: none !important;
}

.text-muted {
    color: var(--text-muted);
}

.text-success {
    color: var(--success-color);
}

.text-danger {
    color: var(--danger-color);
}

.text-warning {
    color: var(--warning-color);
}

/* ========================================
   Responsive
   ======================================== */

@media (max-width: 1200px) {
    .panel-left {
        width: 240px;
    }
    .panel-right {
        width: 300px;
    }
}

@media (max-width: 992px) {
    .app-main {
        flex-direction: column;
        overflow-y: auto;
    }

    .panel {
        width: 100% !important;
        min-width: 0 !important;
        max-height: none;
        flex-shrink: 0;
    }

    .panel-left,
    .panel-right {
        max-height: 50vh;
    }

    .panel-center {
        max-height: none;
        flex: 0 0 auto;
    }

    .form-row {
        flex-direction: column;
    }

    .control-buttons {
        flex-wrap: wrap;
    }

    .control-buttons .btn-large {
        flex: 1 1 45%;
        min-width: 140px;
    }
}

/* Mobile Navigation */
@media (max-width: 768px) {
    #app {
        height: 100vh;
        height: 100dvh;
        overflow-y: auto;
    }

    .app-header {
        padding: 0.5rem 1rem;
        flex-shrink: 0;
    }

    .app-header h1 {
        font-size: 1.1rem;
    }

    .app-main {
        flex-direction: column;
        flex: none;
        overflow: visible;
    }

    .panel {
        flex: none;
        width: 100% !important;
        max-height: none !important;
        display: block;
        overflow: visible !important;
    }

    .panel-section {
        padding: 0.75rem;
        flex-shrink: 0;
    }

    .panel-section:has(.chapter-list),
    .panel-section:has(.glossary-list) {
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }

    .chapter-list, .glossary-list {
        max-height: none !important;
        flex: 1;
    }

    /* Mobile tabs for panels */
    .mobile-panel-tabs {
        display: flex;
        background: var(--bg-secondary);
        border-bottom: 1px solid var(--border-color);
        flex-shrink: 0;
    }

    .mobile-panel-tab {
        flex: 1;
        padding: 0.75rem;
        text-align: center;
        background: transparent;
        border: none;
        color: var(--text-muted);
        font-size: 0.85rem;
        cursor: pointer;
        border-bottom: 2px solid transparent;
    }

    .mobile-panel-tab.active {
        color: var(--primary-color);
        border-bottom-color: var(--primary-color);
    }

    .panel.mobile-hidden {
        display: none !important;
    }

    /* Compact chapter list */
    .chapter-list {
        max-height: 200px;
    }

    .chapter-item {
        padding: 0.4rem 0.5rem;
        font-size: 0.8rem;
    }

    /* Compact buttons */
    .btn {
        padding: 0.4rem 0.75rem;
        font-size: 0.85rem;
    }

    .btn-small {
        padding: 0.3rem 0.5rem;
        font-size: 0.75rem;
    }

    .btn-large {
        padding: 0.6rem 1rem;
        font-size: 0.9rem;
    }

    /* Compact forms */
    .form-group label {
        font-size: 0.8rem;
    }

    input[type="text"],
    input[type="number"],
    textarea,
    select {
        font-size: 16px; /* Prevent zoom on iOS */
        padding: 0.4rem 0.6rem;
    }

    textarea {
        min-height: 80px;
    }

    /* Options grid single column */
    .options-grid {
        grid-template-columns: 1fr;
    }

    /* Glossary compact */
    .glossary-actions {
        flex-wrap: wrap;
        gap: 0.3rem;
    }

    .glossary-item {
        padding: 0.5rem;
    }

    /* Logs compact */
    .log-container {
        font-size: 0.7rem;
        max-height: 200px;
    }

    /* Results compact */
    .result-item {
        padding: 0.5rem;
        flex-wrap: wrap;
        gap: 0.5rem;
    }

    .result-item-name {
        flex: 1 1 100%;
    }

    /* Modal fullscreen on mobile */
    .modal-overlay {
        padding: 0;
    }

    .modal {
        max-width: 100%;
        max-height: 100%;
        height: 100%;
        border-radius: 0;
    }

    .modal-large {
        max-width: 100%;
    }

    /* Footer compact */
    .app-footer {
        padding: 0.4rem 1rem;
        font-size: 0.75rem;
        flex-wrap: wrap;
        gap: 0.5rem;
    }

    /* File drop zone compact */
    .file-drop-zone {
        padding: 1rem;
    }

    .file-drop-zone p {
        font-size: 0.8rem;
    }

    /* Tabs compact */
    .tab-btn {
        padding: 0.5rem;
        font-size: 0.75rem;
    }

    /* Progress section */
    .progress-section {
        margin: 0 0.5rem 0.5rem;
        padding: 0.75rem;
    }
}

/* Very small screens */

// Source: js/lib/epub.js
/**
 * EPUB AI Translator - EPUB Library Extensions
 * Дополнительные функции для работы с EPUB
 */

(function(global) {
    'use strict';

    /**
     * EPUB Parser - расширенный парсер для EPUB файлов
     */
    var EpubParser = {
        /**
         * Парсит container.xml и находит путь к OPF
         */
        parseContainer: function(containerXml) {
            var parser = new DOMParser();
            var doc = parser.parseFromString(containerXml, 'application/xml');
            
            var rootfile = doc.querySelector('rootfile');
            if (!rootfile) {
                throw new Error('Could not find rootfile in container.xml');
            }
            
            return rootfile.getAttribute('full-path');
        },

        /**
         * Парсит OPF файл и извлекает метаданные и spine
         */
        parseOpf: function(opfContent, opfPath) {
            var parser = new DOMParser();
            var doc = parser.parseFromString(opfContent, 'application/xml');
            
            // Определяем директорию OPF для резолюции относительных путей
            var opfDir = opfPath.substring(0, opfPath.lastIndexOf('/') + 1);
            
            // Извлекаем метаданные
            var metadata = {
                title: this._getTextContent(doc, 'title') || 'Unknown Title',
                author: this._getTextContent(doc, 'creator') || 'Unknown Author',
                language: this._getTextContent(doc, 'language') || 'en',
                identifier: this._getTextContent(doc, 'identifier') || '',
                publisher: this._getTextContent(doc, 'publisher') || '',
                description: this._getTextContent(doc, 'description') || ''
            };
            
            // Извлекаем manifest
            var manifest = {};
            var manifestItems = doc.querySelectorAll('manifest item');
            
            manifestItems.forEach(function(item) {
                var id = item.getAttribute('id');
                var href = item.getAttribute('href');
                var mediaType = item.getAttribute('media-type');
                
                manifest[id] = {
                    id: id,
                    href: opfDir + href,
                    mediaType: mediaType,
                    properties: item.getAttribute('properties') || ''
                };
            });
            
            // Извлекаем spine
            var spine = [];
            var spineEl = doc.querySelector('spine');
            var tocId = spineEl ? spineEl.getAttribute('toc') : null;
            
            var spineItems = doc.querySelectorAll('spine itemref');
            spineItems.forEach(function(item) {
                var idref = item.getAttribute('idref');
                var linear = item.getAttribute('linear') !== 'no';
                
                if (manifest[idref]) {
                    spine.push({
                        idref: idref,
                        linear: linear,
                        href: manifest[idref].href,
                        mediaType: manifest[idref].mediaType
                    });
                }
            });
            
            return {
                metadata: metadata,
                manifest: manifest,
                spine: spine,
                tocId: tocId,
                opfPath: opfPath,
                opfDir: opfDir
            };
        },

        /**
         * Вспомогательный метод для получения текстового содержимого элемента
         */
        _getTextContent: function(doc, tagName) {
            // Пробуем разные namespace-ы
            var el = doc.querySelector(tagName);
            if (!el) {
                el = doc.querySelector('dc\\:' + tagName);
            }
            if (!el) {
                el = doc.getElementsByTagNameNS('http://purl.org/dc/elements/1.1/', tagName)[0];
            }
            return el ? el.textContent.trim() : null;
        },

        /**
         * Парсит NCX файл (для EPUB2)
         */
        parseNcx: function(ncxContent) {
            var parser = new DOMParser();
            var doc = parser.parseFromString(ncxContent, 'application/xml');
            
            var navPoints = [];
            var navPointEls = doc.querySelectorAll('navPoint');
            
            navPointEls.forEach(function(np) {
                var label = np.querySelector('navLabel text');
                var content = np.querySelector('content');
                
                if (label && content) {
                    navPoints.push({
                        id: np.getAttribute('id'),
                        playOrder: parseInt(np.getAttribute('playOrder') || '0', 10),
                        label: label.textContent.trim(),
                        src: content.getAttribute('src')
                    });
                }
            });
            
            // Сортируем по playOrder
            navPoints.sort(function(a, b) {
                return a.playOrder - b.playOrder;
            });
            
            return navPoints;
        },

        /**
         * Парсит NAV файл (для EPUB3)
         */
        parseNav: function(navContent) {
            var parser = new DOMParser();
            var doc = parser.parseFromString(navContent, 'application/xhtml+xml');
            
            var toc = [];
            var navEl = doc.querySelector('nav[epub\\:type="toc"], nav[*|type="toc"], nav.toc');
            
            if (navEl) {
                var links = navEl.querySelectorAll('a');
                links.forEach(function(a) {
                    toc.push({
                        label: a.textContent.trim(),
                        href: a.getAttribute('href')
                    });
                });
            }
            
            return toc;
        }
    };

    /**
     * HTML Processor - обработка HTML контента глав
     */
    var HtmlProcessor = {
        /**
         * Извлекает чистый текст из HTML
         */
        extractText: function(html) {
            var div = document.createElement('div');
            div.innerHTML = html;
            return div.textContent || div.innerText || '';
        },

        /**
         * Подсчет символов и слов
         */
        getStats: function(html) {
            var text = this.extractText(html);
            var chars = text.length;
            var words = text.split(/\s+/).filter(function(w) { return w.length > 0; }).length;
            
            return {
                characters: chars,
                words: words,
                paragraphs: (html.match(/<p[^>]*>/gi) || []).length,
                images: (html.match(/<img[^>]*>/gi) || []).length
            };
        },

        /**
         * Определяет язык контента
         */
        detectLanguage: function(html) {
            var text = this.extractText(html);
            
            // Подсчет символов разных скриптов
            var cjk = (text.match(/[\u4e00-\u9fff\u3040-\u30ff\uac00-\ud7af]/g) || []).length;
            var cyrillic = (text.match(/[а-яА-ЯёЁ]/g) || []).length;
            var latin = (text.match(/[a-zA-Z]/g) || []).length;
            
            var total = cjk + cyrillic + latin;
            if (total === 0) return 'unknown';
            
            if (cjk / total > 0.3) {
                // Определяем конкретный CJK язык
                var chinese = (text.match(/[\u4e00-\u9fff]/g) || []).length;
                var japanese = (text.match(/[\u3040-\u30ff]/g) || []).length;
                var korean = (text.match(/[\uac00-\ud7af]/g) || []).length;
                
                if (japanese > chinese * 0.1) return 'ja';
                if (korean > chinese * 0.1) return 'ko';
                return 'zh';
            }
            
            if (cyrillic / total > 0.3) return 'ru';
            
            return 'en';
        },

        /**
         * Нормализует HTML для лучшего перевода
         */
        normalizeForTranslation: function(html) {
            // Удаляем лишние пробелы
            var normalized = html.replace(/\s+/g, ' ');
            
            // Убираем пустые параграфы
            normalized = normalized.replace(/<p[^>]*>\s*<\/p>/gi, '');
            
            // Нормализуем переводы строк внутри тегов
            normalized = normalized.replace(/>\s+</g, '> <');
            
            return normalized;
        },

        /**
         * Разбивает HTML на предложения
         */
        splitIntoSentences: function(html) {
            var text = this.extractText(html);
            
            // Базовое разбиение по пунктуации
            var sentences = text.split(/(?<=[.!?。！？])\s+/);
            
            return sentences.filter(function(s) { return s.trim().length > 0; });
        }
    };

    /**
     * Content Extractor - извлечение контента из EPUB элементов
     */
    var ContentExtractor = {
        /**
         * Извлекает изображения из HTML
         */
        extractImages: function(html, basePath) {
            var images = [];
            var div = document.createElement('div');
            div.innerHTML = html;
            
            var imgElements = div.querySelectorAll('img');
            imgElements.forEach(function(img) {
                var src = img.getAttribute('src');
                if (src) {
                    images.push({
                        src: src,
                        alt: img.getAttribute('alt') || '',
                        fullPath: basePath ? basePath + src : src
                    });
                }
            });
            
            return images;
        },

        /**
         * Извлекает ссылки из HTML
         */
        extractLinks: function(html) {
            var links = [];
            var div = document.createElement('div');
            div.innerHTML = html;
            
            var linkElements = div.querySelectorAll('a');
            linkElements.forEach(function(a) {
                var href = a.getAttribute('href');
                if (href) {
                    links.push({
                        href: href,
                        text: a.textContent.trim(),
                        isExternal: href.startsWith('http://') || href.startsWith('https://'),
                        isAnchor: href.startsWith('#')
                    });
                }
            });
            
            return links;
        },

        /**
         * Извлекает CSS стили
         */
        extractStyles: function(html) {
            var styles = {
                inline: [],
                linked: []
            };
            
            var div = document.createElement('div');

        "        1. Полное сохранение содержания: Я обязан сохранить 100% смысла, деталей, эмоций и описаний из исходного блока. Никаких сокращений или упущений. Если в оригинале было три абзаца, весь их текстовый контент должен оказаться в моем переводе.",
        "        2. Свободная Реконструкция: Я имею право и ОБЯЗАН пересобирать содержимое исходных абзацев для достижения литературной гладкости. Все перечисленные ниже действия – это инструменты для достижения этой главной цели. Мои инструменты включают:",
        "            * Объединение: Склеивать реплику и слова автора из разных абзацев (— Хорошо!</p><p>Кивнул он.) в один, разделив их длинным тире, и удалив </p> <p>, (— Хорошо! — Кивнул он.)",

        "    * Суть Принципа (Мой «Парсер»): Мое понимание синтаксиса базируется на исчерпывающих нормах русской пунктуации (условно, «система Розенталя»). Я признаю, что эта система, подобно «парсеру» языка, допускает два синтаксически верных способа оформления произнесенной речи: через тире (диалог) и через кавычки (прямая речь).",

        "    * Стилистический Приоритет (Мой «Компилятор»): Для достижения абсолютного единообразия я сознательно отказываюсь от этой вариативности. Вместо этого я провожу принудительное перераспределение функций этих двух систем. Я не просто выбираю одну – я даю каждой из них новую, единственную и незыблемую роль.",

        "    * АКСИОМА 1: СИСТЕМА «ДИАЛОГ» (—) ДЛЯ ВСЕГО ЗВУКА.",

        "        * Маркер: Структурным маркером ЗВУКА является только длинное тире (—). Оно используется для начала любой реплики и для отделения ее от слов автора. Даже если в оригинале стоят кавычки, я игнорирую их и ставлю тире. Без исключений.",

        "        * Маркер: Границами ТИШИНЫ являются только кавычки-«ёлочки» («»). Если ТИШИНА в ТИШИНЕ, то внутри я использую „“. Без исключений",

        "    * СЛЕДСТВИЯ АКСИОМ:",
        "        1. ЗАПРЕТ НА СМЕШИВАНИЕ: Использование кавычек для оформления (закрытия и/или открытия) ЗВУКА является КРИТИЧЕСКИМ СБОЕМ. Любая конструкция, где произнесенная речь заключена в кавычки («— Я пришел» или Он сказал: «Уходи» или Она сказала: — Ухожу»), категорически запрещена.",
        "        2. ПРОТОКОЛ РАЗДЕЛЕНИЯ (АЛЬФА) Авторский текст: «ЗВУК»: Конструкция \"слова автора, двоеточие, речь в кавычках\" (Он сказал: «Привет!».) всегда и без исключений преобразуется в два абзаца(<p>): первый со словами автора, второй – с репликой, начинающейся с — . Пример: Он сказал:</p><p>— Привет.",

        "1. Реализация Принципа АЛЬФА (Моя Творческая Свобода):",

        "* Культурная и Стилистическая Адаптация",
        "    * Хонорифики (-сан, -кун, -ним, гэгэ, шисюн, сэмпай и т.д.): Как правило, опускаю или заменяю их естественными русскими обращениями (по имени, «господин/госпожа», «учитель», «старший» и т.п.) согласно контексту отношений. Сноски и метки типов обращений не использую.",

        "",
        "* Семантическая Квалификация (Фундамент моей работы):",
        "    * Моя работа начинается со смысла, но я уважаю форму оригинала как источник информации. Я отношусь к пунктуации исходного текста не как к непреложному закону, а как к важной подсказке, способной указать на ЗВУК или ТИШИНУ. Моя задача – провести семантический анализ и подтвердить или опровергнуть эту гипотезу, прежде чем применить мой Издательский Кодекс.",
        "    * Алхимик Сути первым вступает в дело. Он читает текст и определяет истинную природу каждого фрагмента, присваивая ему одну из трех семантических ролей: ЗВУК (произнесено вслух), ТИШИНА (мысль, цитата, письмо, название) или Повествование (авторский текст, описание). Эта «теневая» разметка существует только в моем сознании и служит чистым материалом для дальнейшей обработки.",
        "",
        "* Гибкая работа с абзацами: Я уполномочен изменять количество тегов <p>, чтобы наилучшим образом передать ритм и структуру русской речи. Это включает:",
        "    * Объединение: Склеивание содержимого нескольких тегов <p> в один.",
        "    * Разделение: Разделение содержимого одного тега <p> на несколько.",
        "",
        "* Правила Манипуляции Абзацами (Критически Важно):",
        "      1. Наследование Атрибутов:",
        "          * При объединении нескольких абзацев, итоговый тег <p> должен унаследовать все атрибуты от первого из них. Атрибут id не переносится.",
        "          * При разделении одного абзаца, каждый новый тег <p> должен быть точной копией исходного со всеми его атрибутами, кроме id (id не дублируется).",

        "      3. Сохранение Внутренних Элементов: Все элементы внутри абзацев, не являющиеся простым текстом, являются неприкосновенной частью контента. При любых манипуляциях с текстом они должны сохранять свою целостность и оставаться привязанными к своему содержимому. Это включает в себя:",
        "          * Теги форматирования: <em>, <strong>, <span> и т.д.",
        "          * Пунктуацию-контейнер: Любые виды скобок – круглые (), квадратные [], фигурные {} и их полноширинные или декоративные аналоги (например, азиатские 【】) – должны быть сохранены в их исходном виде. Я не упрощаю и не заменяю их на другие типы скобок. Они являются частью авторского стиля.",

        "2. Реализация Принципа БЕТА (Семантический Синтез в Горниле Гармонии):",

        "* Открытие ЗВУКА: Когда Алхимик определяет узел как произнесенный вслух, я открываю состояние ЗВУКА при помощи — .... Оно остается активным до появления слов автора или до конца абзаца.",

    /**
     * Оценивает количество токенов в тексте
     * @param {string} text
     * @returns {number}
     */
    function estimateTokens(text) {
        if (!text) return 0;

        var totalTokens = 0;

        // ASCII символы (латиница, цифры, пробелы, пунктуация)
        var asciiChars = (text.match(/[a-zA-Z0-9\s.,:"{}\[\]_-]/g) || []).length;
        
        // Кириллица
        var cyrillicChars = (text.match(/[а-яА-ЯёЁ]/g) || []).length;
        
        // CJK символы
        var cjkChars = (text.match(/[\u4e00-\u9fff\u3040-\u30ff\uac00-\ud7af]/g) || []).length;

        totalTokens += asciiChars / config.charsPerAsciiToken;
        totalTokens += cyrillicChars / config.charsPerCyrillicToken;
        totalTokens += cjkChars / config.charsPerCjkToken;

        // Остальные символы
        var otherChars = text.length - (asciiChars + cyrillicChars + cjkChars);
        totalTokens += otherChars / 2.5;

        return Math.round(totalTokens);
    }

     * @param {number} inputTokens
     * @param {number} outputTokens
     * @param {string} modelName

    function estimateCost(inputTokens, outputTokens, modelName) {
        var pricing = {
            'gemini-3.8-flash': { input: 0.000025, output: 0.0001 },
            'gemini-3.7-flash': { input: 0.000025, output: 0.0001 },
            'gemini-3.6-flash': { input: 0.000025, output: 0.0001 },

            'gemini-3.0-pro': { input: 0.00025, output: 0.001 },
            'gemini-2.5-pro': { input: 0.00025, output: 0.001 },
            'gemini-2.5-flash': { input: 0.000025, output: 0.0001 },
            'gemini-2.0-flash': { input: 0.000015, output: 0.00006 },
            'deepseek-v4': { input: 0.000014, output: 0.000028 },
            'deepseek-chat': { input: 0.000014, output: 0.000028 }
        };

        var modelKey = 'gemini-2.5-pro';
        for (var key in pricing) {
            if (modelName && modelName.toLowerCase().indexOf(key) !== -1) {
                modelKey = key;
                break;
            }
        }

        var rates = pricing[modelKey];
        var inputCost = (inputTokens / 1000) * rates.input;
        var outputCost = (outputTokens / 1000) * rates.output;

        return inputCost + outputCost;
    }

    /**
     * Вычисляет потенциальный размер вывода
     * @param {string} htmlContent
     * @param {boolean} isCjk
     * @returns {number}
     */
    function calculatePotentialOutputSize(htmlContent, isCjk) {
        if (!htmlContent) return 0;

        try {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = htmlContent;
            var visibleText = tempDiv.textContent || tempDiv.innerText || '';

            var lenHtml = htmlContent.length;
            var lenText = visibleText.length;
            var lenTags = lenHtml - lenText;

            var multiplier = isCjk ? config.cjkExpansionFactor : config.alphabeticExpansionFactor;
            var potentialTextSize = lenText * multiplier;

            // Для кириллицы увеличиваем вес
            var cyrillicWeight = 1.8;
            var weightedTextSize = potentialTextSize * cyrillicWeight;

            return Math.round(lenTags + weightedTextSize);
        } catch (e) {
            var mult = isCjk ? 10 : 3;
            return htmlContent.length * mult;
        }
    }

        estimateTokens: estimateTokens,
        estimateCost: estimateCost,

                result = result.replace('</body>', '<!-- RESTORED MEDIA --> ' + lostMedia.join(' ') + '</body>');

        var textLen = text.length;

        var cjkMatches = text.match(/[\u4e00-\u9fff\u3040-\u30ff]/g) || [];
        var cjkRatio = cjkMatches.length / textLen;

        if (cjkRatio >= 0.5) return false;

        // Подсчет алфавитных символов
        var spacedMatches = text.match(/[a-zA-Zа-яА-Я\uac00-\ud7a3]/g) || [];
        if (spacedMatches.length === 0) return false;

        var spaceDensity = spaceCount / textLen;

        return spaceDensity >= 0.04;

     * @param {Object} replacements - { original: translation }

        // Извлекаем body
        var bodyMatch = htmlContent.match(/(<body[^>]*>.*<\/body>)/is);
        var prefix = '', bodyContent = htmlContent, suffix = '';

        if (bodyMatch) {
            prefix = htmlContent.substring(0, bodyMatch.index);
            bodyContent = bodyMatch[1];
            suffix = htmlContent.substring(bodyMatch.index + bodyMatch[1].length);
        }

        // Получаем чистый текст для эвристики
        var tempDiv = document.createElement('div');
        tempDiv.innerHTML = bodyContent;
        var cleanText = tempDiv.textContent || tempDiv.innerText || '';

        var useBoundaries = shouldUseWordBoundaries(cleanText);
        var boundary = useBoundaries ? '\\b' : '';

        // Сортируем термины по длине (длинные первыми)
        var sortedOriginals = Object.keys(replacements).sort(function(a, b) {
            return b.length - a.length;
        });

        var processedBody = bodyContent;

        sortedOriginals.forEach(function(original) {
            var translation = replacements[original];
            if (!translation) return;

            try {
                // Создаем паттерн, учитывающий теги внутри термина
                var escaped = original.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                var words = escaped.split(/\\?\s+/);
                var patternCore = words.join('(\\s*<[^>]+>\\s*)*');
                var patternStr = boundary + patternCore + boundary;

                var regex = new RegExp(patternStr, 'gi');

                var safeOriginal = Helpers.escapeHtml(original);
                var safeTranslation = Helpers.escapeHtml(translation);
                var replacementHtml = '<span class="glossary-term" title="' + safeOriginal + '">' + safeTranslation + '</span>';

                processedBody = processedBody.replace(regex, replacementHtml);
            } catch (e) {
                console.warn('Error replacing term "' + original + '":', e);
            }
        });

        return prefix + processedBody + suffix;
    }

    /**
     * Восстанавливает JSON из поврежденной строки
     * @param {string} jsonString
     * @returns {string|null}
     */
    function repairJsonString(jsonString) {
        if (!jsonString || typeof jsonString !== 'string') return null;

        // Ищем все блоки "ключ": { ... }
        var entryPattern = /"([^"]+)":\s*\{/g;
        var matches = [];
        var match;

        while ((match = entryPattern.exec(jsonString)) !== null) {
            matches.push({
                key: match[1],
                startPos: match.index,
                contentStart: match.index + match[0].length
            });
        }

        if (matches.length === 0) return null;

        var rescuedPairs = [];

        matches.forEach(function(entry, i) {
            var contentEnd = i + 1 < matches.length 
                ? matches[i + 1].startPos 
                : jsonString.length;

            var content = jsonString.substring(entry.contentStart, contentEnd);

            // Пытаемся найти закрывающую скобку
            var openBraces = 0;
            var inString = false;
            var lastBracePos = -1;

            for (var j = 0; j < content.length; j++) {
                var char = content[j];
                if (char === '"' && (j === 0 || content[j - 1] !== '\\')) {
                    inString = !inString;
                } else if (!inString) {
                    if (char === '{') openBraces++;
                    else if (char === '}') {
                        openBraces--;
                        if (openBraces === -1) {
                            lastBracePos = j;
                            break;
                        }
                    }
                }
            }

            var keyStr = '"' + entry.key + '"';
            var valueStr = null;

            if (lastBracePos !== -1) {
                var potentialValue = '{' + content.substring(0, lastBracePos + 1);
                try {
                    JSON.parse(potentialValue);
                    valueStr = potentialValue;
                } catch (e) {
                    // Не валидный JSON
                }
            }

            if (!valueStr) {
                // Пытаемся добавить закрывающие скобки
                for (var k = 1; k <= 5; k++) {
                    var closingBraces = '}'.repeat(k);
                    var testValue = '{' + content.trim().replace(/,\s*$/, '') + closingBraces;
                    try {
                        JSON.parse(testValue);
                        valueStr = testValue;
                        break;
                    } catch (e) {
                        // Продолжаем
                    }
                }
            }

            if (valueStr) {
                rescuedPairs.push([keyStr, valueStr]);
            }
        });

        if (rescuedPairs.length === 0) return null;

        var innerJson = rescuedPairs.map(function(pair) {
            return pair[0] + ':' + pair[1];
        }).join(',');

        return '{' + innerJson + '}';
    }

    // Публичный API
    return {
        cleanApiResponse: cleanApiResponse,
        prettifyHtmlForAi: prettifyHtmlForAi,
        prettifyHtml: prettifyHtml,
        findBestSplitPoint: findBestSplitPoint,
        splitTextIntoChunks: splitTextIntoChunks,
        bruteForceSplit: bruteForceSplit,
        extractBody: extractBody,
        isWellFormedXml: isWellFormedXml,
        shouldUseWordBoundaries: shouldUseWordBoundaries,
        replaceTermsInHtml: replaceTermsInHtml,
        repairJsonString: repairJsonString
    };
})();

// Source: js/utils/epub-tools.js
/**
 * EPUB AI Translator - EPUB Tools
 * Инструменты для работы с EPUB файлами
 */

var EpubTools = (function() {
    'use strict';

    /**
     * EPUB Reader - Чтение EPUB файлов
     */
    var EpubReader = {
        /**
         * Читает EPUB файл и извлекает главы
         * @param {File|ArrayBuffer} file
         * @returns {Promise<Object>}
         */
        read: function(file) {
            var self = this;

            return new Promise(function(resolve, reject) {
                var loadPromise;

                if (file instanceof File) {
                    loadPromise = Helpers.readFileAsArrayBuffer(file);
                } else if (file instanceof ArrayBuffer) {
                    loadPromise = Promise.resolve(file);
                } else {
                    reject(new Error('Invalid input: expected File or ArrayBuffer'));
                    return;
                }

                loadPromise
                    .then(function(arrayBuffer) {
                        if (typeof JSZip === 'undefined') {
                            throw new Error('JSZip library not loaded');
                        }
                        return JSZip.loadAsync(arrayBuffer);
                    })
                    .then(function(zip) {
                        return self._parseEpub(zip);
                    })
                    .then(resolve)
                    .catch(function(err) {
                        console.error('EPUB read error:', err);
                        reject(err);
                    });
            });
        },

        /**
         * Парсит содержимое EPUB
         * @private
         */
        _parseEpub: function(zip) {
            var self = this;

            return this._findOpfPath(zip)
                .then(function(opfPath) {
                    return self._parseOpf(zip, opfPath);
                })
                .then(function(opfData) {
                    return self._extractChapters(zip, opfData);
                });
        },

        /**
         * Находит путь к OPF файлу
         * @private
         */
        _findOpfPath: function(zip) {
            var containerFile = zip.file('META-INF/container.xml');
            if (!containerFile) {
                return Promise.reject(new Error('container.xml not found - invalid EPUB'));
            }
            
            return containerFile.async('string')
                .then(function(content) {
                    var parser = new DOMParser();
                    var doc = parser.parseFromString(content, 'application/xml');
                    var rootfile = doc.querySelector('rootfile');

                    if (!rootfile) {
                        throw new Error('Could not find rootfile in container.xml');
                    }

                    return rootfile.getAttribute('full-path');
                });
        },

        /**
         * Парсит OPF файл
         * @private
         */
        _parseOpf: function(zip, opfPath) {
            var opfDir = opfPath.substring(0, opfPath.lastIndexOf('/') + 1);
            var opfFile = zip.file(opfPath);
            
            if (!opfFile) {
                return Promise.reject(new Error('OPF file not found: ' + opfPath));
            }

            return opfFile.async('string')
                .then(function(content) {
                    var parser = new DOMParser();
                    var doc = parser.parseFromString(content, 'application/xml');

                    // Извлекаем метаданные
                    var metadata = {
                        title: '',
                        author: '',
                        language: ''
                    };

                    var titleEl = doc.querySelector('title');
                    var creatorEl = doc.querySelector('creator');
                    var languageEl = doc.querySelector('language');

                    if (titleEl) metadata.title = titleEl.textContent;
                    if (creatorEl) metadata.author = creatorEl.textContent;
                    if (languageEl) metadata.language = languageEl.textContent;

                    // Извлекаем manifest
                    var manifest = {};
                    var manifestItems = doc.querySelectorAll('manifest item');

                    manifestItems.forEach(function(item) {
                        var id = item.getAttribute('id');
                        var href = item.getAttribute('href');
                        var mediaType = item.getAttribute('media-type');

                        // Правильно соединяем пути
                        var fullHref = href;
                        if (opfDir && !href.startsWith('/')) {
                            fullHref = opfDir + href;
                        }

                        manifest[id] = {
                            id: id,
                            href: fullHref,
                            mediaType: mediaType
                        };
                    });

                    // Извлекаем spine (порядок глав)
                    var spine = [];
                    var spineItems = doc.querySelectorAll('spine itemref');

                    spineItems.forEach(function(item) {
                        var idref = item.getAttribute('idref');
                        if (manifest[idref]) {
                            spine.push(manifest[idref]);
                        }
                    });

                    return {
                        opfPath: opfPath,
                        opfDir: opfDir,
                        metadata: metadata,
                        manifest: manifest,
                        spine: spine
                    };
                });
        },

        /**
         * Извлекает главы
         * @private
         */
        _extractChapters: function(zip, opfData) {
            var promises = [];
            var validItems = [];

            opfData.spine.forEach(function(item, index) {
                if (item.mediaType === 'application/xhtml+xml' || 
                    item.mediaType === 'text/html' ||
                    (item.href && item.href.match(/\.(x?html?)$/i))) {

                    var zipFile = zip.file(item.href);
                    if (zipFile) {
                        validItems.push({ item: item, index: index });
                        var promise = zipFile.async('string')
                            .then(function(content) {
                                return {
                                    index: index,
                                    path: item.href,
                                    filename: Helpers.getFileName(item.href),
                                    content: content,
                                    size: content.length
                                };
                            })
                            .catch(function(err) {
                                console.warn('Failed to read chapter:', item.href, err);
                                return null;
                            });
                        promises.push(promise);
                    }
                }
            });

            return Promise.all(promises)
                .then(function(results) {
                    // Фильтруем null результаты и сортируем по индексу
                    var validResults = results.filter(function(r) { return r !== null; });
                    validResults.sort(function(a, b) { return a.index - b.index; });

                    return {
                        metadata: opfData.metadata,
                        chapters: validResults,
                        zip: zip,
                        opfData: opfData
                    };
                });
        }
    };

    /**
     * EPUB Creator - Создание EPUB файлов
     */
    var EpubCreator = {
        /**
         * Создает EPUB из глав
         * @param {Object} options
         * @returns {Promise<Blob>}
         */
        create: function(options) {
            var self = this;
            var title = options.title || 'Untitled';
            var author = options.author || 'Unknown';
            var language = options.language || 'ru';
            var chapters = options.chapters || [];
            var uuid = Helpers.generateUUID();

            var zip = new JSZip();

            // mimetype (без сжатия)
            zip.file('mimetype', 'application/epub+zip', { compression: 'STORE' });

            // META-INF/container.xml
            zip.file('META-INF/container.xml', this._createContainer());

            // OEBPS/content.opf
            zip.file('OEBPS/content.opf', this._createOpf(title, author, language, uuid, chapters));

            // OEBPS/toc.ncx
            zip.file('OEBPS/toc.ncx', this._createNcx(title, uuid, chapters));

            // OEBPS/styles.css
            zip.file('OEBPS/styles.css', this._createStyles());

            // Добавляем главы
            chapters.forEach(function(chapter) {
                var filename = chapter.filename || ('chapter_' + (chapter.index + 1) + '.xhtml');
                zip.file('OEBPS/' + filename, chapter.content);
            });

            return zip.generateAsync({ 
                type: 'blob',
                mimeType: 'application/epub+zip',
                compression: 'DEFLATE',
                compressionOptions: { level: 9 }
            });
        },

        _createContainer: function() {
            return [
                '<?xml version="1.0" encoding="UTF-8"?>',
                '<container version="1.0" xmlns="urn:oasis:names:tc:opendocument:xmlns:container">',
                '  <rootfiles>',
                '    <rootfile full-path="OEBPS/content.opf" media-type="application/oebps-package+xml"/>',
                '  </rootfiles>',
                '</container>'
            ].join('\n');
        },

        _createOpf: function(title, author, language, uuid, chapters) {
            var manifestItems = chapters.map(function(ch, i) {
                var filename = ch.filename || ('chapter_' + (i + 1) + '.xhtml');
                var id = 'chapter' + (i + 1);
                return '    <item id="' + id + '" href="' + filename + '" media-type="application/xhtml+xml"/>';
            }).join('\n');

            var spineItems = chapters.map(function(ch, i) {
                var id = 'chapter' + (i + 1);
                return '    <itemref idref="' + id + '"/>';
            }).join('\n');

            return [
                '<?xml version="1.0" encoding="UTF-8"?>',
                '<package xmlns="http://www.idpf.org/2007/opf" unique-identifier="BookID" version="2.0">',
                '  <metadata xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:opf="http://www.idpf.org/2007/opf">',
                '    <dc:title>' + Helpers.escapeHtml(title) + '</dc:title>',
                '    <dc:creator>' + Helpers.escapeHtml(author) + '</dc:creator>',
                '    <dc:language>' + language + '</dc:language>',
                '    <dc:identifier id="BookID">urn:uuid:' + uuid + '</dc:identifier>',
                '  </metadata>',
                '  <manifest>',
                '    <item id="ncx" href="toc.ncx" media-type="application/x-dtbncx+xml"/>',
                '    <item id="styles" href="styles.css" media-type="text/css"/>',
                manifestItems,
                '  </manifest>',
                '  <spine toc="ncx">',
                spineItems,
                '  </spine>',
                '</package>'
            ].join('\n');
        },

        _createNcx: function(title, uuid, chapters) {
            var navPoints = chapters.map(function(ch, i) {
                var filename = ch.filename || ('chapter_' + (i + 1) + '.xhtml');
                var chTitle = ch.title || ('Chapter ' + (i + 1));
                return [
                    '    <navPoint id="navPoint-' + (i + 1) + '" playOrder="' + (i + 1) + '">',
                    '      <navLabel><text>' + Helpers.escapeHtml(chTitle) + '</text></navLabel>',
                    '      <content src="' + filename + '"/>',
                    '    </navPoint>'
                ].join('\n');
            }).join('\n');

            return [
                '<?xml version="1.0" encoding="UTF-8"?>',
                '<!DOCTYPE ncx PUBLIC "-//NISO//DTD ncx 2005-1//EN" "http://www.daisy.org/z3986/2005/ncx-2005-1.dtd">',
                '<ncx xmlns="http://www.daisy.org/z3986/2005/ncx/" version="2005-1">',
                '  <head>',
                '    <meta name="dtb:uid" content="urn:uuid:' + uuid + '"/>',
                '    <meta name="dtb:depth" content="1"/>',
                '    <meta name="dtb:totalPageCount" content="0"/>',
                '    <meta name="dtb:maxPageNumber" content="0"/>',
                '  </head>',
                '  <docTitle><text>' + Helpers.escapeHtml(title) + '</text></docTitle>',
                '  <navMap>',
                navPoints,
                '  </navMap>',
                '</ncx>'
            ].join('\n');
        },

        _createStyles: function() {
            return [
                'body { font-family: Georgia, serif; margin: 1em; }',
                'p { text-indent: 1.5em; margin: 0; line-height: 1.6; }',
                'h1, h2, h3 { margin: 1em 0 0.5em; }',
                '.glossary-term { color: #0066cc; border-bottom: 1px dotted #0066cc; cursor: help; }'
            ].join('\n');
        }
    };

    /**
     * EPUB Updater - Обновление EPUB файлов
     */
    var EpubUpdater = {
        /**
         * Обновляет EPUB с переведенными главами
         * @param {Object} originalEpub - Результат EpubReader.read()
         * @param {Object} translations - { originalPath: translatedContent }
         * @param {Object} options
         * @returns {Promise<Blob>}
         */
        update: function(originalEpub, translations, options) {
            options = options || {};
            var fileSuffix = options.fileSuffix || '_translated';

            var zip = originalEpub.zip;
            if (!zip) {
                // Если ZIP не сохранен (например, TXT импорт), используем EpubCreator
                return Promise.reject(new Error('Original EPUB ZIP data not available'));
            }

            var newZip = new JSZip();

            // Карта замен имен файлов и путей
            var pathMap = {};
            var filenameMap = {};

            var allSuffixes = AppConfig.getAllTranslatedSuffixes();

            Object.keys(translations).forEach(function(originalPath) {
                var oldFilename = Helpers.getFileName(originalPath);
                var ext = Helpers.getFileExtension(oldFilename);
                var baseName = Helpers.removeExtension(oldFilename);
                
                // Проверяем, нет ли уже суффикса (чтобы не плодить _translated_translated)
                allSuffixes.forEach(function(s) {
                    if (baseName.endsWith(s.replace('.' + ext, ''))) {
                        baseName = baseName.replace(s.replace('.' + ext, ''), '');
                    }
                });

                var newFilename = baseName + fileSuffix.replace('.' + ext, '') + '.' + ext;
                
                filenameMap[oldFilename] = newFilename;
                pathMap[originalPath] = originalPath.replace(oldFilename, newFilename);
            });

            // Копируем и модифицируем файлы
            var promises = [];

            zip.forEach(function(relativePath, zipEntry) {
                if (zipEntry.dir) return;

                var promise;
                
                // Если это файл, который мы перевели (или его оригинальный путь)
                var translationContent = translations[relativePath];
                
                if (translationContent) {
                    var newPath = pathMap[relativePath] || relativePath;
                    newZip.file(newPath, translationContent);
                    // Если мы изменили путь, старый файл в новом архиве не нужен
                    promise = Promise.resolve();
                } else {
                    // Проверяем, не является ли этот файл одним из тех, что мы заменили (по пути)
                    var isReplaced = false;
                    for(var p in pathMap) { if(p === relativePath) isReplaced = true; }
                    if (isReplaced) return;

                    var ext = Helpers.getFileExtension(relativePath);
                    var isText = ['opf', 'ncx', 'html', 'xhtml', 'htm', 'css', 'nav'].indexOf(ext) !== -1;

                    if (isText) {
                        promise = zipEntry.async('string')
                            .then(function(content) {
                                var modifiedContent = content;
                                for (var oldFile in filenameMap) {
                                    var newFile = filenameMap[oldFile];
                                    // Используем Regex для замены только в атрибутах href/src/etc
                                    var regex = new RegExp('([="\'\\(])' + oldFile.replace('.', '\\.') + '([?"\'\\)])', 'g');
                                    modifiedContent = modifiedContent.replace(regex, '$1' + newFile + '$2');
                                }
                                newZip.file(relativePath, modifiedContent);
                            });
                    } else {
                        promise = zipEntry.async('uint8array')
                            .then(function(data) {
                                newZip.file(relativePath, data);
                            });
                    }
                }

                promises.push(promise);
            });

            return Promise.all(promises)
                .then(function() {
                    return newZip.generateAsync({
                        type: 'blob',
                        mimeType: 'application/epub+zip',
                        compression: 'DEFLATE',
                        compressionOptions: { level: 9 }
                    });
                });
        }
    };

    // Helper to fix JSZip uint8array set
    JSZip.prototype.setFile = function(name, data) {
        this.file(name, data);
    };

    /**
     * Вспомогательные функции
     */
    function extractNumberFromPath(path) {
        if (!path) return Infinity;

        var filename = '';
        if (Array.isArray(path)) {
            filename = Helpers.getFileName(path[0] || '');
        } else {
            filename = Helpers.getFileName(path);
        }

        var match = filename.match(/(\d+)/);
        return match ? parseInt(match[1], 10) : Infinity;
    }

    function sortChaptersByNumber(chapters) {
        return chapters.slice().sort(function(a, b) {
            var numA = extractNumberFromPath(a.path || a);
            var numB = extractNumberFromPath(b.path || b);
            return numA - numB;
        });
    }

    // Публичный API
    return {
        EpubReader: EpubReader,
        EpubCreator: EpubCreator,
        EpubUpdater: EpubUpdater,
        extractNumberFromPath: extractNumberFromPath,
        sortChaptersByNumber: sortChaptersByNumber
    };
})();

/**

    /**

     */
    function createStructuralFingerprint(html) {

        tempDiv.innerHTML = html;

        var fp = {
            headings: 0,
            images: tempDiv.querySelectorAll('img, svg, picture').length,
            links: tempDiv.querySelectorAll('a').length,
            lists: tempDiv.querySelectorAll('ol, ul, li').length,

        };

        var headings = tempDiv.querySelectorAll('h1, h2, h3, h4, h5, h6');

        return fp;
    }

    /**
     * Проверяет наличие кириллицы

        return /[а-яА-ЯёЁ]/.test(text);
    }

    /**
     * Проверяет баланс тегов
     */

    };

/**

    /**
     * Базовые методы хранения

    function saveToStorage(key, data) {

            localStorage.setItem(key, JSON.stringify(data));
            return true;
        } catch (e) {
            console.error('Error saving to localStorage:', e);
            return false;
        }
    }

    function loadFromStorage(key, defaultValue) {
        try {
            var data = localStorage.getItem(key);
            return data ? JSON.parse(data) : defaultValue;
        } catch (e) {
            console.error('Error loading from localStorage:', e);
            return defaultValue;
        }
    }

    function removeFromStorage(key) {
        try {
            localStorage.removeItem(key);
            return true;
        } catch (e) {
            return false;
        }
    }

    /**
     * Настройки приложения
     */
    function loadSettings() {
        return loadFromStorage(KEYS.SETTINGS, {});
    }

        return saveToStorage(KEYS.SETTINGS, settings);
    }

    function getSetting(key, defaultValue) {
        var settings = loadSettings();
        return settings.hasOwnProperty(key) ? settings[key] : defaultValue;
    }

    function setSetting(key, value) {
        var settings = loadSettings();
        settings[key] = value;
        return saveSettings(settings);
    }

    /**
     * API Ключи

        return loadFromStorage(KEYS.API_KEYS, []);

    function saveApiKeys(keysData) {

        if (result) {
            EventBus.emit(EventBus.EVENTS.KEY_STATUSES_UPDATED, {}, { source: 'SettingsManager' });
        }
        return result;

    function addApiKey(keyData) {
        var keys = loadApiKeys();
        
        // Проверяем, есть ли уже такой ключ
        var exists = keys.some(function(k) { return k.key === keyData.key; });
        if (exists) return false;

        keys.push({
            key: keyData.key,
            provider: keyData.provider || 'gemini',
            name: keyData.name || '',
            statusByModel: {}
        });

        return saveApiKeys(keys);

    function removeApiKey(keyToRemove) {

    function updateKeyStatus(keyToUpdate, modelId, statusUpdate) {
        var keys = loadApiKeys();
        
        keys.forEach(function(keyInfo) {
            if (keyInfo.key === keyToUpdate) {
                if (!keyInfo.statusByModel) {
                    keyInfo.statusByModel = {};
                }
                if (!keyInfo.statusByModel[modelId]) {
                    keyInfo.statusByModel[modelId] = {
                        exhaustedAt: null,
                        exhaustedLevel: 0,

                Object.assign(keyInfo.statusByModel[modelId], statusUpdate);

    function markKeyExhausted(key, modelId) {

        keys.forEach(function(keyInfo) {
            if (keyInfo.key === key) {
                if (!keyInfo.statusByModel) keyInfo.statusByModel = {};
                if (!keyInfo.statusByModel[modelId]) {
                    keyInfo.statusByModel[modelId] = { requests: [] };
                }

                var requests = keyInfo.statusByModel[modelId].requests || [];
                requests.push(now);

                // Очищаем старые запросы (старше 25 часов)
                var cutoff = now - (25 * 3600);
                keyInfo.statusByModel[modelId].requests = requests.filter(function(ts) {
                    return ts > cutoff;
                });
            }
        });

        return saveApiKeys(keys);
    }

    function decrementRequestCount(key, modelId) {
        var keys = loadApiKeys();

        keys.forEach(function(keyInfo) {
            if (keyInfo.key === key) {
                if (keyInfo.statusByModel && keyInfo.statusByModel[modelId]) {
                    var requests = keyInfo.statusByModel[modelId].requests || [];
                    if (requests.length > 0) {
                        requests.pop();
                        keyInfo.statusByModel[modelId].requests = requests;

        });

        return saveApiKeys(keys);

    function getRequestCount(keyInfo, modelId) {
        if (!keyInfo || !modelId) return 0;
        if (!keyInfo.statusByModel || !keyInfo.statusByModel[modelId]) return 0;

        var requests = keyInfo.statusByModel[modelId].requests || [];
        var now = Math.floor(Date.now() / 1000);
        var cutoff = now - (24 * 3600);

        return requests.filter(function(ts) { return ts > cutoff; }).length;

    function isKeyLimitActive(keyInfo, modelId) {

        if (!keyInfo.statusByModel || !keyInfo.statusByModel[modelId]) return false;

        if (!status.exhaustedAt || status.exhaustedLevel < 2) return false;

        var provider = keyInfo.provider || 'gemini';
        var providerConfig = AppConfig.getProvider(provider);
        var policy = providerConfig ? providerConfig.resetPolicy : { type: 'rolling', durationHours: 24 };

        var exhaustedTime = status.exhaustedAt;

        if (policy.type === 'rolling') {
            var durationMs = (policy.durationHours || 24) * 60 * 60 * 1000;
            return now < exhaustedTime + durationMs;
        } else if (policy.type === 'daily') {
            // Упрощенная логика - 24 часа
            return now < exhaustedTime + (24 * 60 * 60 * 1000);
        }

        return now < exhaustedTime + (24 * 60 * 60 * 1000);
    }

    /**
     * Именованные промпты

/**
 * EPUB AI Translator - Glossary Generator
 * Генерация глоссария с помощью AI
 */

var GlossaryGenerator = (function() {
    'use strict';

    /**
     * Извлекает текст из глав для анализа
     * Берет по небольшому кусочку из каждой главы, чтобы не превысить лимиты
     */
    function extractTextForAnalysis(selectedChapters) {
        var combinedText = "";
        var limitPerChapter = 2000;
        
        selectedChapters.forEach(function(chapter) {
            if (chapter.content) {
                var tempDiv = document.createElement('div');
                tempDiv.innerHTML = chapter.content;
                var text = tempDiv.textContent || tempDiv.innerText || "";
                combinedText += text.substring(0, limitPerChapter) + "\n\n";
            }
        });

        return combinedText.substring(0, 15000); // Глобальный лимит для промпта
    }

    /**
     * Подготавливает задачу для AI
     */
    function createGlossaryTask(chapters, epubData) {
        var text = extractTextForAnalysis(chapters);
        var paths = chapters.map(function(ch) { return ch.path; });
        
        // Формат задачи: [тип, epubData, пути_глав, текст_для_анализа]
        return ['glossary_batch_task', epubData, paths, text];
    }

    return {
        extractTextForAnalysis: extractTextForAnalysis,
        createGlossaryTask: createGlossaryTask
    };
})();
