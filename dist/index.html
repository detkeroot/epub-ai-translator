/**
 * EPUB AI Translator - Glossary Manager
 * Управление глоссарием
 */

var GlossaryManager = (function() {
    'use strict';

    var STORAGE_KEY = 'epub_translator_glossary';

    // Текущий глоссарий в памяти
    var glossary = [];
    var similarityMap = null;
    var fuzzyThreshold = 100;

    /**
     * Загружает глоссарий из localStorage
     * @returns {Array}
     */
    function load() {
        try {
            var data = localStorage.getItem(STORAGE_KEY);
            glossary = data ? JSON.parse(data) : [];
        } catch (e) {
            console.error('Error loading glossary:', e);
            glossary = [];
        }
        return glossary;
    }

    /**
     * Сохраняет глоссарий в localStorage
     * @returns {boolean}
     */
    function save() {
        try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(glossary));
            EventBus.emit(EventBus.EVENTS.GLOSSARY_UPDATED, { count: glossary.length }, { source: 'GlossaryManager' });
            return true;
        } catch (e) {
            console.error('Error saving glossary:', e);
            return false;
        }
    }

    /**
     * Возвращает текущий глоссарий
     * @returns {Array}
     */
    function getAll() {
        return glossary.slice();
    }

    /**
     * Возвращает глоссарий как объект { original: { translation, note } }
     * @returns {Object}
     */
    function toObject() {
        var result = {};
        glossary.forEach(function(entry) {
            if (entry.original) {
                result[entry.original] = {
                    translation: entry.translation || '',
                    note: entry.note || ''
                };
            }
        });
        return result;
    }

    /**
     * Устанавливает глоссарий из массива
     * @param {Array} newGlossary
     */
    function setAll(newGlossary) {
        glossary = Array.isArray(newGlossary) ? newGlossary : [];
        similarityMap = null;
        save();
    }

    /**
     * Устанавливает глоссарий из объекта
     * @param {Object} glossaryObject
     */
    function fromObject(glossaryObject) {
        glossary = [];
        for (var original in glossaryObject) {
            if (glossaryObject.hasOwnProperty(original)) {
                var data = glossaryObject[original];
                glossary.push({
                    original: original,
                    translation: typeof data === 'string' ? data : (data.translation || ''),
                    note: typeof data === 'object' ? (data.note || '') : ''
                });
            }
        }
        similarityMap = null;
        save();
    }

    /**
     * Добавляет термин
     * @param {Object} entry - { original, translation, note }
     * @returns {boolean}
     */
    function addTerm(entry) {
        if (!entry || !entry.original) return false;

        // Проверяем на дубликат
        var exists = glossary.some(function(e) {
            return e.original === entry.original;
        });

        if (exists) {
            // Обновляем существующий
            glossary.forEach(function(e) {
                if (e.original === entry.original) {
                    e.translation = entry.translation || e.translation;
                    e.note = entry.note !== undefined ? entry.note : e.note;
                }
            });
        } else {
            glossary.push({
                original: entry.original,
                translation: entry.translation || '',
                note: entry.note || ''
            });
        }

        similarityMap = null;
        save();
        return true;
    }

    /**
     * Обновляет термин
     * @param {string} original - Исходный термин
     * @param {Object} updates - { translation?, note?, newOriginal? }
     * @returns {boolean}
     */
    function updateTerm(original, updates) {
        var found = false;

        glossary.forEach(function(entry) {
            if (entry.original === original) {
                if (updates.translation !== undefined) entry.translation = updates.translation;
                if (updates.note !== undefined) entry.note = updates.note;
                if (updates.newOriginal) entry.original = updates.newOriginal;
                found = true;
            }
        });

        if (found) {
            similarityMap = null;
            save();
        }

        return found;
    }

    /**
     * Удаляет термин
     * @param {string} original
     * @returns {boolean}
     */
    function removeTerm(original) {
        var initialLength = glossary.length;
        glossary = glossary.filter(function(e) {
            return e.original !== original;
        });

        if (glossary.length !== initialLength) {
            similarityMap = null;
            save();
            return true;
        }

        return false;
    }

    /**
     * Очищает глоссарий
     */
    function clear() {
        glossary = [];
        similarityMap = null;
        save();
    }

    /**
     * Возвращает количество терминов
     * @returns {number}
     */
    function count() {
        return glossary.length;
    }

    /**
     * Ищет термины
     * @param {string} query
     * @returns {Array}
     */
    function search(query) {
        if (!query) return glossary.slice();

        var lowerQuery = query.toLowerCase();

        return glossary.filter(function(entry) {
            return (entry.original && entry.original.toLowerCase().indexOf(lowerQuery) !== -1) ||
                   (entry.translation && entry.translation.toLowerCase().indexOf(lowerQuery) !== -1) ||
                   (entry.note && entry.note.toLowerCase().indexOf(lowerQuery) !== -1);
        });
    }

    /**
     * Экспортирует глоссарий в JSON
     * @returns {string}
     */
    function exportToJson() {
        return JSON.stringify(glossary, null, 2);
    }

    /**
     * Экспортирует глоссарий в CSV
     * @returns {string}
     */
    function exportToCsv() {
        var lines = ['original,translation,note'];

        glossary.forEach(function(entry) {
            var original = '"' + (entry.original || '').replace(/"/g, '""') + '"';
            var translation = '"' + (entry.translation || '').replace(/"/g, '""') + '"';
            var note = '"' + (entry.note || '').replace(/"/g, '""') + '"';
            lines.push(original + ',' + translation + ',' + note);
        });

        return lines.join('\n');
    }

    /**
     * Импортирует глоссарий из JSON
     * @param {string} jsonString
     * @param {string} mode - 'replace', 'merge', 'supplement'
     * @returns {Object} { success, count, errors }
     */
    function importFromJson(jsonString, mode) {
        mode = mode || 'replace';

        try {
            var data = JSON.parse(jsonString);
            var entries = [];

            // Обрабатываем разные форматы
            if (Array.isArray(data)) {
                entries = data;
            } else if (typeof data === 'object') {
                // Формат { original: { translation, note } }
                for (var key in data) {
                    if (data.hasOwnProperty(key)) {
                        var value = data[key];
                        entries.push({
                            original: key,
                            translation: typeof value === 'string' ? value : (value.translation || ''),
                            note: typeof value === 'object' ? (value.note || '') : ''
                        });
                    }
                }
            }

            return mergeEntries(entries, mode);
        } catch (e) {
            return { success: false, count: 0, errors: [e.message] };
        }
    }

    /**
     * Импортирует глоссарий из CSV
     * @param {string} csvString
     * @param {string} mode
     * @returns {Object}
     */
    function importFromCsv(csvString, mode) {
        mode = mode || 'replace';

        try {
            var lines = csvString.split('\n');
            var entries = [];
            var errors = [];

            // Пропускаем заголовок
            for (var i = 1; i < lines.length; i++) {
                var line = lines[i].trim();
                if (!line) continue;

                try {
                    var parts = parseCsvLine(line);
                    if (parts.length >= 2) {
                        entries.push({
                            original: parts[0],
                            translation: parts[1],
                            note: parts[2] || ''
                        });
                    }
                } catch (e) {
                    errors.push('Line ' + (i + 1) + ': ' + e.message);
                }
            }

            var result = mergeEntries(entries, mode);
            result.errors = result.errors.concat(errors);
            return result;
        } catch (e) {
            return { success: false, count: 0, errors: [e.message] };
        }
    }

    /**
     * Парсит строку CSV
     * @private
     */
    function parseCsvLine(line) {
        var result = [];
        var current = '';
        var inQuotes = false;

        for (var i = 0; i < line.length; i++) {
            var char = line[i];

            if (char === '"') {
                if (inQuotes && line[i + 1] === '"') {
                    current += '"';
                    i++;
                } else {
                    inQuotes = !inQuotes;
                }
            } else if (char === ',' && !inQuotes) {
                result.push(current.trim());
                current = '';
            } else {
                current += char;
            }
        }

        result.push(current.trim());
        return result;
    }

    /**
     * Сливает записи с существующим глоссарием
     * @private
     */
    function mergeEntries(entries, mode) {
        var addedCount = 0;
        var errors = [];

        entries = entries.filter(function(e) {
            if (!e.original || !e.original.trim()) {
                return false;
            }
            return true;
        });

        if (mode === 'replace') {
            glossary = entries;
            addedCount = entries.length;
        } else if (mode === 'merge' || mode === 'update') {
            var existingMap = {};
            glossary.forEach(function(e) {
                existingMap[e.original.toLowerCase()] = e;
            });

            entries.forEach(function(entry) {
                var key = entry.original.toLowerCase();
                if (existingMap[key]) {
                    // Обновляем
                    existingMap[key].translation = entry.translation || existingMap[key].translation;
                    existingMap[key].note = entry.note || existingMap[key].note;
                } else {
                    glossary.push(entry);
                    existingMap[key] = entry;
                }
                addedCount++;
            });
        } else if (mode === 'supplement') {
            var existingOriginals = new Set(glossary.map(function(e) {
                return e.original.toLowerCase();
            }));

            entries.forEach(function(entry) {
                if (!existingOriginals.has(entry.original.toLowerCase())) {
                    glossary.push(entry);
                    addedCount++;
                }
            });
        }

        similarityMap = null;
        save();

        return { success: true, count: addedCount, errors: errors };
    }

    /**
     * Обновляет настройки фильтрации
     * @param {Object} settings
     */
    function updateSettings(settings) {
        if (settings.fuzzyThreshold !== undefined) {
            fuzzyThreshold = settings.fuzzyThreshold;
        }

        // Перестраиваем карту схожести если нужно
        if (fuzzyThreshold < 100 && glossary.length > 1) {
            similarityMap = LanguageTools.GlossaryLogic.buildSimilarityMap(glossary, fuzzyThreshold);
        } else {
            similarityMap = null;
        }
    }

    /**
     * Фильтрует глоссарий для текста
     * @param {string} text
     * @param {Object} options
     * @returns {Object}
     */
    function filterForText(text, options) {
        options = options || {};
        var threshold = options.fuzzyThreshold || fuzzyThreshold;

        return LanguageTools.GlossaryFilter.filterForText(
            toObject(),
            text,
            { 
                fuzzyThreshold: threshold,
                similarityMap: similarityMap
            }
        );
    }

    /**
     * Форматирует глоссарий для промпта
     * @param {string} textContent - Текст для динамической фильтрации (опционально)
     * @param {boolean} useDynamic - Использовать динамическую фильтрацию
     * @returns {Object} { glossaryString, contextString, stats }
     */
    function formatForPrompt(textContent, useDynamic) {
        var glossaryToUse = toObject();
        var stats = null;

        if (useDynamic && textContent && Object.keys(glossaryToUse).length > 0) {
            var originalSize = Object.keys(glossaryToUse).length;
            // Используем SmartGlossaryFilter если доступен
            glossaryToUse = filterForText(textContent, { fuzzyThreshold: fuzzyThreshold });
            var filteredSize = Object.keys(glossaryToUse).length;

            stats = {
                original: originalSize,
                filtered: filteredSize,
                reductionPercent: originalSize > 0 ? ((1 - filteredSize / originalSize) * 100).toFixed(1) : 0
            };
        }

        var glossaryLines = [];
        var contextLines = [];

        for (var original in glossaryToUse) {
            var data = glossaryToUse[original];
            var translation = typeof data === 'string' ? data : (data ? data.translation : '');
            var note = typeof data === 'object' ? (data ? data.note : '') : '';

            if (translation) {
                glossaryLines.push('* "' + original + '" = "' + translation + '"');
                if (note) {
                    contextLines.push('* ' + translation + ' - ' + note);
                }
            }
        }

        return {
            glossaryString: glossaryLines.length > 0 ? glossaryLines.join('\n') : 'Глоссарий пуст.',
            contextString: contextLines.length > 0 ? contextLines.join('\n') : 'Дополнительный контекст не предоставлен.',
            stats: stats
        };
    }

    /**
     * Находит конфликты в глоссарии
     * @returns {Object}
     */
    function findConflicts() {
        return LanguageTools.GlossaryLogic.findDirectConflicts(glossary);
    }

    /**
     * Находит пересечения терминов
     * @returns {Object}
     */
    function findOverlaps() {
        return LanguageTools.GlossaryLogic.findOverlapGroups(glossary);
    }

    /**
     * Агрегатор глоссария (для слияния результатов AI)
     */
    var Aggregator = {
        /**
         * Сливает новые термины на основе режима
         * @param {Array} initialGlossary - Исходный список
         * @param {Array} newTerms - Новые термины от AI
         * @param {string} mode - 'accumulate', 'supplement', 'update'
         * @returns {Array}
         */
        merge: function(initialGlossary, newTerms, mode) {
            initialGlossary = initialGlossary || [];
            if (!Array.isArray(newTerms)) return initialGlossary.slice();
            mode = mode || 'supplement';

            if (mode === 'accumulate') {
                return initialGlossary.concat(newTerms);
            }

            if (mode === 'supplement') {
                var existingKeys = new Set(initialGlossary.map(function(e) {
                    return (e.original || '').trim().toLowerCase();
                }));

                var result = initialGlossary.slice();
                newTerms.forEach(function(term) {
                    var key = (term.original || '').trim().toLowerCase();
                    if (key && !existingKeys.has(key)) {
                        result.push(term);
                        existingKeys.add(key);
                    }
                });
                return result;
            }

            if (mode === 'update') {
                var existingMap = {};
                initialGlossary.forEach(function(e) {
                    var key = (e.original || '').trim().toLowerCase();
                    if (key) existingMap[key] = e;
                });

                newTerms.forEach(function(term) {
                    var key = (term.original || '').trim().toLowerCase();
                    if (key) {
                        // AI перезаписывает старое значение
                        existingMap[key] = term;
                    }
                });

                return Object.keys(existingMap).map(function(k) { return existingMap[k]; });
            }

            return initialGlossary.slice();
        }
    };

    // Инициализация
    load();

    // Публичный API
    return {
        load: load,
        save: save,
        getAll: getAll,
        toObject: toObject,
        setAll: setAll,
        fromObject: fromObject,
        addTerm: addTerm,
        updateTerm: updateTerm,
        removeTerm: removeTerm,
        clear: clear,
        count: count,
        search: search,
        exportToJson: exportToJson,
        exportToCsv: exportToCsv,
        importFromJson: importFromJson,
        importFromCsv: importFromCsv,
        updateSettings: updateSettings,
        filterForText: filterForText,
        formatForPrompt: formatForPrompt,
        findConflicts: findConflicts,
        findOverlaps: findOverlaps,
        Aggregator: Aggregator
    };
})();

/**
 * EPUB AI Translator - Task Manager
 * Управление очередью задач перевода
 */

var TaskManager = (function() {
    'use strict';

    /**
     * Создает новый менеджер задач
     */
    function create(allTasks) {
        var pending = allTasks ? allTasks.slice() : [];
        var priority = [];
        var inProgress = {};
        var completed = new Set();
        var failed = new Set();
        var failureTracker = {};
        var sessionId = null;

        /**
         * Получает отображаемое имя задачи
         */
        function getTaskDisplayName(task) {
            if (!task) return 'Неизвестная задача';

            var taskType = task[0];

            try {
                switch (taskType) {
                    case 'epub':
                        return 'Глава "' + Helpers.getFileName(task[2]) + '"';
                    case 'epub_chunk':
                        return 'Часть #' + (task[4] + 1) + ' из "' + Helpers.getFileName(task[2]) + '"';
                    case 'epub_batch':
                        return 'Пакет из ' + task[2].length + ' глав';
                    case 'glossary_batch_task':
                        return 'Пакет глоссария из ' + task[2].length + ' глав';
                    case 'raw_text_translation':
                        return task[3] ? '✨ ' + task[3] : 'Прямой перевод';
                    default:
                        return 'Задача типа "' + taskType + '"';
                }
            } catch (e) {
                return 'Задача';
            }
        }

        /**
         * Получает следующую задачу для воркера
         */
        function getNextTask(workerId) {
            // Сначала из приоритетной очереди
            var task = priority.shift();
            if (!task) {
                task = pending.shift();
            }

            if (task) {
                if (!inProgress[workerId]) {
                    inProgress[workerId] = new Set();
                }
                inProgress[workerId].add(task);

                log('[TASK] Задача "' + getTaskDisplayName(task) + '" передана воркеру …' + workerId.slice(-4));
            }

            return task;
        }

        /**
         * Добавляет приоритетные задачи
         */
        function addPriorityTasks(tasks, parentHistory) {
            priority = tasks.concat(priority);

            if (parentHistory) {
                tasks.forEach(function(task) {
                    failureTracker[taskKey(task)] = Helpers.deepClone(parentHistory);
                });
            }
        }

        /**
         * Генерирует ключ для задачи
         */
        function taskKey(task) {
            return JSON.stringify(task);
        }

        /**
         * Получает историю ошибок для задачи
         */
        function getFailureHistory(task) {
            var key = taskKey(task);
            return failureTracker[key] ? Helpers.deepClone(failureTracker[key]) : { totalCount: 0, errors: {} };
        }

        /**
         * Регистрирует ошибку
         */
        function recordFailure(task, errorType) {
            var key = taskKey(task);
            var history = failureTracker[key] || { totalCount: 0, errors: {} };

            history.totalCount++;
            history.errors[errorType] = (history.errors[errorType] || 0) + 1;
            failureTracker[key] = history;

            log('[TASK] Зарегистрирована ошибка для "' + getTaskDisplayName(task) + 
                '" (тип: ' + errorType + ', всего: ' + history.totalCount + ')');
        }

        /**
         * Отмечает задачу как выполненную
         */
        function taskDone(workerId, task) {
            if (inProgress[workerId]) {
                inProgress[workerId].delete(task);
                if (inProgress[workerId].size === 0) {
                    delete inProgress[workerId];
                }
            }

            completed.add(taskKey(task));
            delete failureTracker[taskKey(task)];

            log('[TASK] ✅ Задача "' + getTaskDisplayName(task) + '" успешно выполнена.');
        }

        /**
         * Отмечает задачу как провалившуюся окончательно
         */
        function taskFailedPermanently(workerId, task) {
            if (inProgress[workerId]) {
                inProgress[workerId].delete(task);
                if (inProgress[workerId].size === 0) {
                    delete inProgress[workerId];
                }
            }

            failed.add(taskKey(task));
            log('[TASK] ❌ Задача "' + getTaskDisplayName(task) + '" провалена окончательно.');
        }

        /**
         * Возвращает задачу в очередь
         */
        function taskRequeued(workerId, task) {
            if (inProgress[workerId]) {
                inProgress[workerId].delete(task);
                if (inProgress[workerId].size === 0) {
                    delete inProgress[workerId];
                }
            }

            pending.unshift(task);
            log('[TASK] 🔄 Задача "' + getTaskDisplayName(task) + '" возвращена в очередь.');
        }

        /**
         * Возвращает задачу для повторной попытки
         */
        function taskRequeuedForRetry(workerId, task) {
            taskRequeued(workerId, task);
        }

        /**
         * Возвращает все задачи воркера в очередь
         */
        function requeueTasksForWorker(workerId) {
            if (inProgress[workerId]) {
                var tasks = Array.from(inProgress[workerId]);
                pending = tasks.concat(pending);
                delete inProgress[workerId];
                log('[TASK] 🔄 Возвращено в очередь ' + tasks.length + ' задач от воркера …' + workerId.slice(-4));
            }
        }

        /**
         * Проверяет, есть ли ожидающие задачи
         */
        function hasPendingTasks() {
            return pending.length > 0 || priority.length > 0;
        }

        /**
         * Проверяет, завершена ли вся работа
         */
        function isFinished() {
            return !hasPendingTasks() && Object.keys(inProgress).length === 0;
        }

        /**
         * Получает прогресс
         */
        function getProgress() {
            var processedCount = completed.size + failed.size;
            var inProgressCount = 0;

            for (var workerId in inProgress) {
                inProgressCount += inProgress[workerId].size;
            }

            var total = pending.length + priority.length + inProgressCount + processedCount;

            return { done: processedCount, total: total };
        }

        /**
         * Очищает очереди
         */
        function clearPendingQueues() {
            var count = pending.length + priority.length;
            pending = [];
            priority = [];
            log('[TASK] ⏹️ Очереди очищены. Удалено ' + count + ' задач.');
            return count;
        }

        /**
         * Очищает состояние
         */
        function clearState() {
            failureTracker = {};
            log('[TASK] Трекер ошибок очищен.');
        }

        /**
         * Количество ожидающих задач
         */
        function getPendingCount() {
            return pending.length + priority.length;
        }

        /**
         * Логирование
         */
        function log(message) {
            EventBus.emit(EventBus.EVENTS.LOG_MESSAGE, {
                message: message,
                level: 'info'
            }, { source: 'TaskManager', sessionId: sessionId });
        }

        // Публичный API экземпляра
        return {
            getNextTask: getNextTask,
            addPriorityTasks: addPriorityTasks,
            getFailureHistory: getFailureHistory,
            recordFailure: recordFailure,
            taskDone: taskDone,
            taskFailedPermanently: taskFailedPermanently,
            taskRequeued: taskRequeued,
            taskRequeuedForRetry: taskRequeuedForRetry,
            requeueTasksForWorker: requeueTasksForWorker,
            hasPendingTasks: hasPendingTasks,
            isFinished: isFinished,
            getProgress: getProgress,
            clearPendingQueues: clearPendingQueues,
            clearState: clearState,
            getPendingCount: getPendingCount,
            getTaskDisplayName: getTaskDisplayName,

            get sessionId() { return sessionId; },
            set sessionId(value) { sessionId = value; }
        };
    }

    /**
     * Подготовщик задач
     */
    var TaskPreparer = {
        /**
         * Подготавливает задачи из глав EPUB
         * @param {Object} settings
         * @param {Array} chapters
         * @returns {Array}
         */
        prepareTasks: function(settings, chapters) {
            var useBatching = settings.useBatching || false;
            var useChunking = settings.chunking !== false;
            var taskSizeLimit = settings.chunkSize || AppConfig.CHUNKING.defaultTargetSize;
            var epubData = settings.epubData;

            if (!chapters || chapters.length === 0) {
                console.warn('TaskPreparer: no chapters provided');
                return [];
            }

            if (useBatching) {
                return this._prepareBatchTasks(settings, chapters, taskSizeLimit, epubData);
            } else {
                return this._prepareIndividualTasks(settings, chapters, useChunking, taskSizeLimit, epubData);
            }
        },

        _prepareBatchTasks: function(settings, chapters, taskSizeLimit, epubData) {
            var tasks = [];
            var currentBatch = [];
            var currentBatchSize = 0;

            chapters.forEach(function(chapter) {
                var size = chapter.size || (chapter.content ? chapter.content.length : 0);

                if (size > taskSizeLimit) {
                    // Слишком большая глава - отправляем батч и добавляем отдельно
                    if (currentBatch.length > 0) {
                        tasks.push(['epub_batch', epubData, currentBatch.slice()]);
                        currentBatch = [];
                        currentBatchSize = 0;
                    }
                    tasks.push(['epub', epubData, chapter.path, chapter]);
                    return;
                }

                if (currentBatchSize + size > taskSizeLimit && currentBatch.length > 0) {
                    tasks.push(['epub_batch', epubData, currentBatch.slice()]);
                    currentBatch = [];
                    currentBatchSize = 0;
                }

                currentBatch.push(chapter.path);
                currentBatchSize += size;
            });

            if (currentBatch.length > 0) {
                tasks.push(['epub_batch', epubData, currentBatch]);
            }

            return tasks;
        },

        _prepareIndividualTasks: function(settings, chapters, useChunking, taskSizeLimit, epubData) {
            var tasks = [];

            chapters.forEach(function(chapter) {
                var size = chapter.size || (chapter.content ? chapter.content.length : 0);
                var content = chapter.content || '';

                if (!useChunking || size <= taskSizeLimit) {
                    // Передаем chapter целиком для доступа к content
                    tasks.push(['epub', epubData, chapter.path, chapter]);
                } else {
                    // Нужно разбить на чанки
                    var bodyParts = TextProcessing.extractBody(content);
                    var chunks = TextProcessing.splitTextIntoChunks(
                        bodyParts.body,
                        taskSizeLimit,
                        AppConfig.CHUNKING.searchWindow,
                        AppConfig.CHUNKING.minChunkSize
                    );

                    chunks.forEach(function(chunkContent, i) {
                        tasks.push([
                            'epub_chunk',
                            epubData,
                            chapter.path,
                            chunkContent,
                            i,
                            chunks.length,
                            bodyParts.prefix,
                            bodyParts.suffix
                        ]);
                    });
                }
            });

            return tasks;
        },

        /**
         * Подготавливает задачи для генерации глоссария
         * @param {Array} chapters
         * @param {number} batchSize
         * @returns {Array}
         */
        prepareGlossaryTasks: function(chapters, batchSize) {
            batchSize = batchSize || 5;
            var tasks = [];

            for (var i = 0; i < chapters.length; i += batchSize) {
                var batch = chapters.slice(i, i + batchSize);
                var paths = batch.map(function(ch) { return ch.path; });
                tasks.push(['glossary_batch_task', null, paths]);
            }

            return tasks;
        }
    };

    // Публичный API
    return {
        create: create,
        TaskPreparer: TaskPreparer
    };
})();

 * Обработчики для различных AI API провайдеров
 */

var ApiHandlers = (function() {

    /**
     * Базовый класс API обработчика
     */
    function BaseApiHandler(worker) {
        this.worker = worker;
        this.abortController = null;
    }

    BaseApiHandler.prototype = {
        /**
         * Настройка клиента
         */
        setup: function(apiKey) {

            this.worker.modelId = this.worker.modelConfig.id;
            return true;
        },

        /**
         * Выполнение API вызова
         */
        execute: function(prompt, options) {
            var self = this;
            options = options || {};

            return new Promise(function(resolve, reject) {
                if (self.worker.isCancelled) {
                    reject({ type: 'CANCEL', message: 'Операция отменена' });
                    return;
                }

                self.abortController = new AbortController();

                self.callApi(prompt, options)
                    .then(resolve)
                    .catch(function(error) {
                        reject(self.classifyError(error));
                    });
            });
        },

        /**
         * Вызов API (переопределяется в наследниках)
         */
        callApi: function(prompt, options) {
            return Promise.reject(new Error('Not implemented'));
        },

        /**
         * Классификация ошибки
         */
        classifyError: function(error) {
            var message = error.message || String(error);
            var messageLower = message.toLowerCase();

            if (messageLower.indexOf('user location') !== -1 || 
                messageLower.indexOf('geo') !== -1) {
                return { type: AppConfig.ERROR_TYPES.GEOBLOCK, message: message, original: error };
            }

            if (messageLower.indexOf('quota') !== -1 || 
                messageLower.indexOf('exhausted') !== -1 ||
                messageLower.indexOf('api key not valid') !== -1 ||
                messageLower.indexOf('invalid api key') !== -1) {
                return { type: AppConfig.ERROR_TYPES.QUOTA_EXCEEDED, message: message, original: error };
            }

            if (messageLower.indexOf('rate limit') !== -1 || 
                error.status === 429) {
                var delay = this.extractRetryDelay(error) || 60;
                return { 
                    type: AppConfig.ERROR_TYPES.TEMPORARY_LIMIT, 
                    message: message, 
                    delay: delay,
                    original: error 
                };
            }

            if (messageLower.indexOf('model') !== -1 && 
                (messageLower.indexOf('not found') !== -1 || messageLower.indexOf('not exist') !== -1)) {
                return { type: AppConfig.ERROR_TYPES.MODEL_NOT_FOUND, message: message, original: error };
            }

            if (messageLower.indexOf('network') !== -1 || 
                messageLower.indexOf('fetch') !== -1 ||
                messageLower.indexOf('timeout') !== -1 ||
                error.name === 'TypeError') {
                return { type: AppConfig.ERROR_TYPES.NETWORK, message: message, original: error };
            }

            if (messageLower.indexOf('safety') !== -1 || 
                messageLower.indexOf('blocked') !== -1 ||
                messageLower.indexOf('content policy') !== -1) {
                return { type: AppConfig.ERROR_TYPES.CONTENT_FILTER, message: message, original: error };
            }

            return { type: AppConfig.ERROR_TYPES.API_ERROR, message: message, original: error };

        extractRetryDelay: function(error) {
            if (error.retryDelay) return error.retryDelay;

            var message = error.message || '';
            var match = message.match(/retry in (\d+)/i);
            if (match) return parseInt(match[1], 10);

    /**

    function GeminiApiHandler(worker) {

    GeminiApiHandler.prototype = Object.create(BaseApiHandler.prototype);

    GeminiApiHandler.prototype.callApi = function(prompt, options) {
        var self = this;
        var allowIncomplete = options.allowIncomplete || false;

        // Gemini 2.0+ models use generateContent
        var baseUrl = 'https://generativelanguage.googleapis.com/v1beta/models/' + 
                      this.worker.modelId + ':generateContent?key=' + this.worker.apiKey;

        var contents = [{ parts: [{ text: prompt }] }];

        var safetySettings = [
            { category: 'HARM_CATEGORY_HATE_SPEECH', threshold: 'BLOCK_NONE' },
            { category: 'HARM_CATEGORY_SEXUALLY_EXPLICIT', threshold: 'BLOCK_NONE' },
            { category: 'HARM_CATEGORY_DANGEROUS_CONTENT', threshold: 'BLOCK_NONE' },
            { category: 'HARM_CATEGORY_HARASSMENT', threshold: 'BLOCK_NONE' }

        };

        if (allowIncomplete) {

            generationConfig.maxOutputTokens = Math.floor(maxTokens * 0.98);
        }

        var minBudgetCfg = this.worker.modelConfig.minThinkingBudget;
        if (minBudgetCfg !== false && minBudgetCfg !== undefined) {
            if (typeof minBudgetCfg === 'string') {
                var level = (this.worker.thinkingEnabled && this.worker.thinkingLevel) ? this.worker.thinkingLevel : minBudgetCfg;
                generationConfig.thinkingConfig = {

            } else if (this.worker.thinkingEnabled) {

            safetySettings: safetySettings

        if (this.worker.systemInstruction) {
            payload.system_instruction = {
                parts: [{ text: this.worker.systemInstruction }]
            };
        }

        return fetch(baseUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
            signal: this.abortController.signal
        })
        .then(function(response) {
            return response.json().then(function(data) {
                return { status: response.status, data: data };
            });
        })
        .then(function(result) {
            var status = result.status;
            var data = result.data;

            if (status === 200) {
                if (data.promptFeedback && data.promptFeedback.blockReason) {
                    throw new Error('Блокировка промпта: ' + data.promptFeedback.blockReason);
                }

                if (data.candidates && data.candidates.length > 0) {
                    var candidate = data.candidates[0];
                    var finishReason = candidate.finishReason;

                    if (finishReason === 'STOP' || (finishReason === 'MAX_TOKENS' && allowIncomplete)) {

            var errorMessage = data.error ? data.error.message : JSON.stringify(data);

                error.status = 429;

    GeminiApiHandler.prototype.extractRetryDelayFromResponse = function(data) {
        try {
            if (data.error && data.error.details) {

                if (details[0] && details[0].metadata && details[0].metadata.retryInfo) {

    /**

    function OpenRouterApiHandler(worker) {

    OpenRouterApiHandler.prototype = Object.create(BaseApiHandler.prototype);

    OpenRouterApiHandler.prototype.callApi = function(prompt, options) {
        var self = this;
        var allowIncomplete = options.allowIncomplete || false;

        var baseUrl = (this.worker.providerConfig && this.worker.providerConfig.baseUrl) || 'https://openrouter.ai/api/v1/chat/completions';

        var messages = [];
        if (this.worker.systemInstruction) {
            messages.push({ role: 'system', content: this.worker.systemInstruction });

        messages.push({ role: 'user', content: prompt });

        var payload = {
            model: this.worker.modelId,
            messages: messages,
            temperature: this.worker.temperature || 1.0
        };

        if (allowIncomplete) {
            var maxTokens = this.worker.modelConfig.maxOutputTokens || 8192;
            payload.max_tokens = Math.floor(maxTokens * 0.98);

            method: 'POST',
            headers: {
                'Authorization': 'Bearer ' + this.worker.apiKey,

            },

            signal: this.abortController.signal
        })
        .then(function(response) {
            return response.json().then(function(data) {
                return { status: response.status, data: data };
            });
        })
        .then(function(result) {
            var status = result.status;
            var data = result.data;

            if (status === 200) {
                if (data.choices && data.choices.length > 0) {
                    var choice = data.choices[0];

                var error = new Error('Квота исчерпана: ' + errorText);
                error.status = status;

            }

            if (status === 404) {
                throw new Error('Модель не найдена: ' + self.worker.modelId);
            }

            throw new Error('Ошибка OpenRouter (' + status + '): ' + errorText);
        });
    };

    /**
     * GLM API Handler (ZhipuAI)
     */
    function GlmApiHandler(worker) {

    GlmApiHandler.prototype = Object.create(BaseApiHandler.prototype);

    GlmApiHandler.prototype.callApi = function(prompt, options) {

            method: 'POST',
            headers: {
                'Authorization': 'Bearer ' + token,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(payload),
            signal: this.abortController.signal
        })
        .then(function(response) {
            return response.json().then(function(data) {
                return { status: response.status, data: data };
            });
        })
        .then(function(result) {
            var status = result.status;
            var data = result.data;

            if (status === 200) {
                if (data.choices && data.choices.length > 0) {
                    var choice = data.choices[0];
                    var finishReason = choice.finish_reason;

                    if (finishReason === 'stop' || (finishReason === 'length' && allowIncomplete)) {
                        return choice.message.content;
                    }

                    throw new Error('Генерация остановлена: ' + finishReason);
                }
                throw new Error('Пустой ответ от GLM');
            }

            var errorText = JSON.stringify(data);
            throw new Error('Ошибка GLM (' + status + '): ' + errorText);
        });
    };

    GlmApiHandler.prototype.generateToken = function() {
        // Упрощенная генерация токена для GLM
        // В реальном приложении нужна библиотека JWT
        // Здесь используем простой Base64
        try {
            var parts = this.worker.apiKey.split('.');
            if (parts.length !== 2) {
                throw new Error('Некорректный формат ключа GLM');
            }
            // Для браузера без JWT библиотеки возвращаем сам ключ
            // (GLM может принимать API key напрямую в некоторых случаях)
            return this.worker.apiKey;
        } catch (e) {
            return this.worker.apiKey;
        }
    };

    /**
     * Dry Run Handler (для тестирования)
     */
    function DryRunApiHandler(worker) {
        BaseApiHandler.call(this, worker);
    }

    DryRunApiHandler.prototype = Object.create(BaseApiHandler.prototype);
    DryRunApiHandler.prototype.constructor = DryRunApiHandler;

    DryRunApiHandler.prototype.setup = function(apiKey) {
        this.worker.apiKey = 'DRY_RUN_KEY';
        this.worker.modelId = 'dry-run-model';
        return true;
    };

    DryRunApiHandler.prototype.callApi = function(prompt, options) {
        var self = this;

        return new Promise(function(resolve, reject) {
            var output = [];

            if (self.worker.systemInstruction) {
                output.push('════════════════════════════════════════════════════');
                output.push('          SYSTEM INSTRUCTION');
                output.push('════════════════════════════════════════════════════');
                output.push(self.worker.systemInstruction);
                output.push('\n\n');
            }

            output.push('════════════════════════════════════════════════════');
            output.push('               USER PROMPT');
            output.push('════════════════════════════════════════════════════');
            output.push(prompt);

            var fullPrompt = output.join('\n');

            EventBus.emit(EventBus.EVENTS.DRY_RUN_PROMPT_READY, {
                promptText: fullPrompt
            }, { source: 'DryRunApiHandler' });

            // Dry run возвращает специальный результат
            reject({ type: 'DRY_RUN', message: 'Dry run completed', promptText: fullPrompt });
        });
    };

    /**
     * Фабрика для создания обработчиков
     */
    function createHandler(handlerName, worker) {
        switch (handlerName) {
            case 'GeminiApiHandler':
                return new GeminiApiHandler(worker);
            case 'OpenRouterApiHandler':
                return new OpenRouterApiHandler(worker);
            case 'GlmApiHandler':
                return new GlmApiHandler(worker);
            case 'DryRunApiHandler':
                return new DryRunApiHandler(worker);
            default:
                console.error('Unknown handler:', handlerName);
                return new GeminiApiHandler(worker);
        }
    }

    // Публичный API
    return {
        BaseApiHandler: BaseApiHandler,
        GeminiApiHandler: GeminiApiHandler,
        OpenRouterApiHandler: OpenRouterApiHandler,
        GlmApiHandler: GlmApiHandler,
        DryRunApiHandler: DryRunApiHandler,
        createHandler: createHandler
    };
})();

/**

    /**

        this.thinkingEnabled = config.thinkingEnabled || false;
        this.thinkingBudget = config.thinkingBudget || -1;
        this.outputFolder = config.outputFolder;

        this.isCancelled = false;
        this.apiHandler = null;

        this.init();

    TranslationWorker.prototype = {
        init: function() {
            var providerConfig = AppConfig.getProvider(this.provider);
            if (!providerConfig) {
                throw new Error('Provider not found: ' + this.provider);
            }
            this.providerConfig = providerConfig;
            var handlerName = providerConfig.handlerClass;
            this.apiHandler = ApiHandlers.createHandler(handlerName, this);

            switch (taskType) {

                    return this.processEpubChapter(task, glossaryData, contextManager);
                case 'epub_batch':

                case 'epub_chunk':

            var combinedWithMarkers = "";
            chapterPaths.forEach(function(path, i) {
                combinedWithMarkers += "\n<!-- " + i + " -->\n";
                // Мы получаем контент синхронно для простоты батчинга здесь, 
                // предполагая что он уже загружен в epubData.chapters
                var chapter = epubData.chapters.find(function(ch) { return ch.path === path; });
                combinedWithMarkers += (chapter ? chapter.content : "");

            combinedWithMarkers += "\n<!-- " + chapterPaths.length + " -->\n";

            var prompt = self.buildPrompt(combinedWithMarkers, glossaryData, null);

                        var endMarker = "<!-- " + (i + 1) + " -->";

                        var endIdx = cleaned.indexOf(endMarker);
                        
                        if (startIdx !== -1 && endIdx !== -1) {

                return self.getChapterContent(epubData, path);
            });

            return Promise.all(promises).then(function(contents) {
                return contents.join('\n\n');
            });
        },

        /**
         * Построение промпта
         */
        buildPrompt: function(textContent, glossaryData, contextManager) {
            var glossaryString = 'Глоссарий пуст.';
            var contextString = 'Контекст не предоставлен.';

            if (glossaryData && Object.keys(glossaryData).length > 0) {
                var formatted = GlossaryManager.formatForPrompt(textContent, true);
                glossaryString = formatted.glossaryString;
                contextString = formatted.contextString;
            }

            var prompt = this.customPrompt || AppConfig.DEFAULT_PROMPT;

            if (this.systemInstruction) {
                // Системная инструкция отдельно, здесь только текст
                var parts = [];
                if (glossaryString !== 'Глоссарий пуст.') {
                    parts.push('--- ТЕРМИНЫ ---\n' + glossaryString);
                }
                if (contextString !== 'Контекст не предоставлен.') {
                    parts.push('--- КОНТЕКСТ ---\n' + contextString);
                }
                parts.push('--- ТЕКСТ ДЛЯ ОБРАБОТКИ ---\n```html\n' + textContent + '\n```');

                return parts.join('\n\n');
            }

            // Классический режим
            prompt = prompt.replace('{text}', '```html\n' + textContent + '\n```');
            prompt = prompt.replace('{glossary}', glossaryString);
            prompt = prompt.replace('{context}', contextString);

            return prompt;
        },

        /**
         * Построение промпта для глоссария
         */
        buildGlossaryPrompt: function(textContent) {
            var template = AppConfig.DEFAULT_GLOSSARY_PROMPT;
            return template.replace('{text}', textContent);
        },

        /**
         * Парсинг ответа глоссария
         */
        parseGlossaryResponse: function(response) {
            try {
                var parsed = JSON.parse(response);
                var terms = [];

                for (var key in parsed) {
                    if (parsed.hasOwnProperty(key)) {
                        var value = parsed[key];
                        terms.push({
                            original: key,
                            translation: typeof value === 'string' ? value : (value.translation || ''),
                            note: typeof value === 'object' ? (value.note || '') : ''
                        });
                    }
                }

                return terms;
            } catch (e) {
                // Пытаемся восстановить JSON
                var repaired = TextProcessing.repairJsonString(response);
                if (repaired) {
                    return this.parseGlossaryResponse(repaired);
                }
                return [];
            }
        },

        /**
         * Валидация ответа
         */
        validateResponse: function(original, translated) {
            return ResponseValidator.validateResponse(original, translated, {
                expectsCyrillic: true
            });
        },

        /**
         * Отмена
         */
        cancel: function() {
            this.isCancelled = true;
            if (this.apiHandler) {
                this.apiHandler.cancel();
            }
        }
    };

    /**
     * Главный движок перевода
     */
    function Engine() {
        this.sessionId = null;
        this.isRunning = false;
        this.isCancelled = false;
        this.isPaused = false;

        this.workers = {};
        this.taskManager = null;
        this.settings = {};

        this.totalTasks = 0;
        this.completedTasks = 0;
        this.failedTasks = 0;

        this.keyWarningCounters = {};
        this.pausedKeys = new Set();

        this.epubData = null;
        this.glossaryData = {};
        this.sessionGlossary = []; // Глоссарий, накопленный за сессию

        this.init();
    }

    /**
     * RPM Limiter - Простой ограничитель частоты запросов
     */
    function RPMLimiter(rpm) {
        this.rpm = rpm || 10;
        this.interval = 60000 / this.rpm;
        this.lastRequestTime = 0;
    }

    RPMLimiter.prototype.canProceed = function() {
        var now = Date.now();
        if (now - this.lastRequestTime >= this.interval) {
            this.lastRequestTime = now;
            return true;
        }
        return false;
    };

    RPMLimiter.prototype.getRemainingWait = function() {
        var now = Date.now();
        return Math.max(0, this.interval - (now - this.lastRequestTime));
    };

    Engine.prototype = {
        init: function() {
            var self = this;
            this.rpmLimiters = {};
            this.assemblyBay = {}; // Для сборки чанков

            // Подписка на события
            EventBus.on(EventBus.EVENTS.STOP_SESSION_REQUESTED, function() {
                self.stop('Остановлено пользователем');
            });
        },

        /**
         * Запуск сессии перевода
         */
        start: function(settings) {
            if (this.isRunning) {
                EventBus.log('Сессия уже запущена', 'warning');
                return;
            }

            // Валидация входных данных
            if (!settings.epubData && !settings.isGlossaryOnly) {
                EventBus.log('Ошибка: EPUB данные не загружены', 'error');
                return;
            }

            if ((!settings.selectedChapters || settings.selectedChapters.length === 0) && !settings.isGlossaryOnly) {
                EventBus.log('Ошибка: не выбраны главы для перевода', 'error');
                return;
            }

            if (!settings.apiKeys || settings.apiKeys.length === 0) {
                EventBus.log('Ошибка: не указаны API ключи', 'error');
                return;
            }

            this.sessionId = Helpers.generateUUID();
            this.isRunning = true;
            this.isCancelled = false;
            this.isPaused = false;

            this.settings = settings;
            this.workers = {};
            this.keyWarningCounters = {};
            this.pausedKeys = new Set();
            this.rpmLimiters = {};
            this.assemblyBay = {};

            // Инициализация RPM лимитеров для каждого ключа
            var self = this;
            settings.apiKeys.forEach(function(key) {
                self.rpmLimiters[key] = new RPMLimiter(settings.rpmLimit || 10);
            });

            this.completedTasks = 0;
            this.failedTasks = 0;

            this.epubData = settings.epubData;
            this.glossaryData = settings.glossaryData || {};

            // Создаем задачи
            var tasks = settings.tasks || this.prepareTasks(settings);
            this.totalTasks = tasks.length;

            if (this.totalTasks === 0) {
                this.finish('Нет задач для выполнения');
                return;
            }

            // Создаем менеджер задач
            this.taskManager = TaskManager.create(tasks);
            this.taskManager.sessionId = this.sessionId;

            EventBus.emit(EventBus.EVENTS.SESSION_STARTED, {
                sessionId: this.sessionId,
                totalTasks: this.totalTasks
            }, { source: 'TranslationEngine' });

            EventBus.log('▶▶▶ Начало сессии: ' + this.sessionId.substring(0, 8), 'success');
            EventBus.log('Задач в очереди: ' + this.totalTasks, 'info');

            // Запускаем воркеров
            this.startWorkers(settings);
        },

        /**
         * Подготовка задач
         */
        prepareTasks: function(settings) {
            var chapters = settings.selectedChapters || [];
            var useChunking = settings.chunking !== false;
            var chunkSize = settings.chunkSize || AppConfig.CHUNKING.defaultTargetSize;

            if (!chapters || chapters.length === 0) {
                EventBus.log('Нет глав для перевода', 'warning');
                return [];
            }

            return TaskManager.TaskPreparer.prepareTasks({
                chunking: useChunking,
                chunkSize: chunkSize,
                epubData: settings.epubData
            }, chapters);
        },

        /**
         * Запуск воркеров (с плавным стартом)
         */
        startWorkers: function(settings) {
            var self = this;
            var apiKeys = settings.apiKeys || [];
            var numInstances = Math.min(settings.numInstances || 1, apiKeys.length * 5); // Ограничение на количество инстансов

            EventBus.log('Запуск воркеров: ' + numInstances, 'info');

            var currentWorker = 0;
            
            function launchNext() {
                if (currentWorker >= numInstances || self.isCancelled) {
                    EventBus.log('Все воркеры (' + currentWorker + ') запущены', 'success');
                    return;
                }

                var apiKey = apiKeys[currentWorker % apiKeys.length];
                self.launchWorker(apiKey, settings);
                currentWorker++;

                // Задержка между запусками воркеров (Ramp-up)
                var delay = numInstances > 1 ? 1500 : 0;
                setTimeout(launchNext, delay);
            }

            launchNext();

            // Начинаем периодическую проверку задач
            this.monitorInterval = setInterval(function() {
                self.processNextTasks();
            }, 1000);
        },

        /**
         * Запуск одного воркера
         */
        launchWorker: function(apiKey, settings) {
            var workerConfig = {
                workerId: apiKey,
                apiKey: apiKey,
                sessionId: this.sessionId,
                provider: settings.provider,
                modelConfig: settings.modelConfig,
                temperature: settings.temperature,
                customPrompt: settings.customPrompt,
                useSystemInstruction: settings.useSystemInstruction,
                thinkingEnabled: settings.thinkingEnabled,
                thinkingBudget: settings.thinkingBudget,
                outputFolder: settings.outputFolder,
                chunking: settings.chunking
            };

            try {
                var worker = new TranslationWorker(workerConfig);
                this.workers[apiKey] = worker;

                EventBus.log('Воркер для ключа …' + apiKey.slice(-4) + ' запущен', 'info');
            } catch (e) {
                EventBus.log('Ошибка создания воркера: ' + e.message, 'error');
            }
        },

        /**
         * Обработка следующих задач
         */
        processNextTasks: function() {
            var self = this;

            if (this.isCancelled || !this.taskManager || this.isPaused) {
                this.checkFinished();
                return;
            }

            // Проверяем завершение
            if (this.taskManager.isFinished()) {
                this.checkFinished();
                return;
            }

            // Для каждого воркера пробуем запустить задачу
            Object.keys(this.workers).forEach(function(workerId) {
                // Если воркер уже занят, пропускаем
                if (self.workers[workerId].isBusy) return;
                
                // Если ключ на паузе, пропускаем
                if (self.pausedKeys.has(workerId)) return;

                // Проверяем RPM лимитер
                var limiter = self.rpmLimiters[workerId];
                if (limiter && !limiter.canProceed()) {
                    // Пробуем запустить позже
                    setTimeout(function() { self.processNextTasks(); }, limiter.getRemainingWait() + 100);
                    return;
                }

                var task = self.taskManager.getNextTask(workerId);
                if (task) {
                    self.executeTask(workerId, task);
                }
            });
        },

        /**
         * Выполнение задачи
         */
        executeTask: function(workerId, task) {
            var self = this;
            var worker = this.workers[workerId];

            if (!worker || worker.isCancelled) {
                this.taskManager.taskRequeued(workerId, task);
                return;
            }

            worker.isBusy = true;
            var taskName = this.taskManager.getTaskDisplayName(task);
            EventBus.log('Обработка: ' + taskName, 'info');

            EventBus.emit(EventBus.EVENTS.TASK_STATUS_UPDATED, {
                task_info: task,
                status: 'processing'
            }, { source: 'TranslationEngine' });

            // Увеличиваем счетчик запросов для ключа
            SettingsManager.incrementRequestCount(workerId, this.settings.modelConfig.id);

            worker.processTask(task, this.glossaryData, null)
                .then(function(result) {
                    worker.isBusy = false;
                    self.handleTaskSuccess(workerId, task, result);
                })
                .catch(function(error) {
                    worker.isBusy = false;
                    self.handleTaskError(workerId, task, error);
                });
        },

        /**
         * Обработка успешного завершения задачи
         */
        handleTaskSuccess: function(workerId, task, result) {
            var self = this;
            this.taskManager.taskDone(workerId, task);
            
            // Сбрасываем счетчик предупреждений
            this.keyWarningCounters[workerId] = 0;

            var taskType = task[0];

            if (taskType === 'epub_batch' && result.results) {
                // Обработка пакета глав
                result.results.forEach(function(content, i) {
                    var path = result.chapterPaths[i];
                    self.completedTasks++;
                    
                    self.saveResult(task, {
                        result: content,
                        originalPath: path
                    });
                });
            } 
            else if (taskType === 'epub_chunk') {
                var path = task[2];
                var chunkIndex = task[4];
                var totalChunks = task[5];
                var prefix = task[6] || '';
                var suffix = task[7] || '';

                if (!this.assemblyBay[path]) {
                    this.assemblyBay[path] = {
                        chunks: {},
                        count: 0,
                        total: totalChunks,
                        prefix: prefix,
                        suffix: suffix
                    };
                }

                this.assemblyBay[path].chunks[chunkIndex] = result.result;
                this.assemblyBay[path].count++;

                if (this.assemblyBay[path].count === totalChunks) {
                    // Все чанки собраны
                    var assembly = this.assemblyBay[path];
                    var combinedContent = '';
                    for (var i = 0; i < totalChunks; i++) {
                        var chunkText = assembly.chunks[i] || '';
                        // Убираем body wrapper если есть
                        chunkText = chunkText.replace(/<\/?body[^>]*>/gi, '');
                        combinedContent += chunkText;
                    }

                    var finalContent = assembly.prefix + combinedContent + assembly.suffix;
                    var prettified = TextProcessing.prettifyHtml(finalContent);

                    this.completedTasks++;
                    this.saveResult(task, {
                        result: prettified,
                        originalPath: path
                    });

                    EventBus.emit(EventBus.EVENTS.ASSEMBLY_FINISHED, {
                        originalPath: path,
                        chunkCount: totalChunks
                    });

                    delete this.assemblyBay[path];
                }
            }
            else {
                this.completedTasks++;
                // Сохраняем результат для одиночной задачи
                this.saveResult(task, result);
            }

            EventBus.emit(EventBus.EVENTS.TASK_FINISHED, {
                task: task,
                result: result,
                success: true
            }, { source: 'TranslationEngine', sessionId: this.sessionId });

            EventBus.emit(EventBus.EVENTS.TASK_STATUS_UPDATED, {
                task_info: task,
                status: 'success'
            }, { source: 'TranslationEngine' });

            EventBus.emit(EventBus.EVENTS.PROGRESS_UPDATED, {
                current: this.completedTasks + this.failedTasks,
                total: this.totalTasks
            }, { source: 'TranslationEngine' });

            // Следующая задача
            this.processNextTasks();
        },

        /**
         * Обработка ошибки задачи
         */
        handleTaskError: function(workerId, task, error) {
            var self = this;
            var errorType = error.type || AppConfig.ERROR_TYPES.API_ERROR;

            // Если ошибка временного лимита - вызываем специальный обработчик
            if (errorType === AppConfig.ERROR_TYPES.TEMPORARY_LIMIT) {
                this.handleTemporaryLimit(workerId, task, error.delay || 60);
                return;
            }

            // Уменьшаем счетчик запросов если произошла ошибка, не связанная с лимитом
            if (errorType !== AppConfig.ERROR_TYPES.QUOTA_EXCEEDED) {
                SettingsManager.decrementRequestCount(workerId, this.settings.modelConfig.id);
            }

            EventBus.log('Ошибка при обработке: ' + (error.message || 'Неизвестная ошибка'), 'error');

            // Фатальные ошибки
            if (errorType === AppConfig.ERROR_TYPES.GEOBLOCK) {
                this.stop('Блокировка по геолокации');
                EventBus.emit(EventBus.EVENTS.GEOBLOCK_DETECTED, {}, { source: 'TranslationEngine' });
                return;
            }

            if (errorType === AppConfig.ERROR_TYPES.MODEL_NOT_FOUND) {
                this.stop('Модель не найдена');
                return;
            }

            if (errorType === AppConfig.ERROR_TYPES.QUOTA_EXCEEDED) {
                this.handleQuotaExceeded(workerId, task);
                return;
            }

            if (errorType === 'DRY_RUN') {
                this.taskManager.taskDone(workerId, task);
                this.stop('Предпросмотр завершен');
                return;
            }

            // Анализ истории ошибок для задачи
            var history = this.taskManager.getFailureHistory(task);
            var totalErrors = history.totalCount || 0;

            // Если это обычная ошибка и попыток мало - повторяем
            if (totalErrors < 2) {
                this.taskManager.recordFailure(task, errorType);
                this.taskManager.taskRequeuedForRetry(workerId, task);
                
                setTimeout(function() {
                    self.processNextTasks();
                }, 2000);
            } 
            // ПЛАН Б: Если попытки перевода главы (epub) исчерпаны, пробуем разбить её на части (chunking)
            else if (task[0] === 'epub' && !history.force_chunked && this.settings.chunking) {
                EventBus.log('❗ Провал попыток для "' + Helpers.getFileName(task[2]) + '". Запуск ПЛАНА Б (разделение на части)...', 'warning');
                
                this.taskManager.recordFailure(task, errorType);
                
                var worker = this.workers[workerId];
                worker.getChapterContent(this.epubData, task[2], task[3])
                    .then(function(content) {
                        var bodyParts = TextProcessing.extractBody(content);
                        var chunks = TextProcessing.splitTextIntoChunks(
                            bodyParts.body,
                            self.settings.chunkSize / 2, // Пробуем меньший размер
                            AppConfig.CHUNKING.searchWindow,
                            AppConfig.CHUNKING.minChunkSize
                        );

                        var newTasks = chunks.map(function(chunkContent, i) {
                            return [
                                'epub_chunk',
                                self.epubData,
                                task[2],
                                chunkContent,
                                i,
                                chunks.length,
                                bodyParts.prefix,
                                bodyParts.suffix
                            ];
                        });

                        history.force_chunked = true;
                        self.taskManager.addPriorityTasks(newTasks, history);
                        
                        // Удаляем старую задачу из общего счетчика (она заменится на несколько новых)
                        self.totalTasks = self.totalTasks - 1 + newTasks.length;
                        
                        EventBus.emit(EventBus.EVENTS.TASKS_ADDED, { count: newTasks.length });
                        self.processNextTasks();
                    });
            }
            else {
                // Окончательный провал
                this.taskManager.taskFailedPermanently(workerId, task);
                this.failedTasks++;

                EventBus.emit(EventBus.EVENTS.TASK_FINISHED, {
                    task: task,
                    success: false,
                    error: error
                }, { source: 'TranslationEngine', sessionId: this.sessionId });

                EventBus.emit(EventBus.EVENTS.TASK_STATUS_UPDATED, {
                    task_info: task,
                    status: 'error'
                }, { source: 'TranslationEngine' });

                EventBus.emit(EventBus.EVENTS.PROGRESS_UPDATED, {
                    current: this.completedTasks + this.failedTasks,
                    total: this.totalTasks
                }, { source: 'TranslationEngine' });

                this.processNextTasks();
            }
        },

        /**
         * Обработка исчерпания квоты
         */
        handleQuotaExceeded: function(workerId, task) {
            var self = this;

            EventBus.log('Ключ …' + workerId.slice(-4) + ' исчерпан', 'warning');

            // Помечаем ключ как исчерпанный
            SettingsManager.markKeyExhausted(workerId, this.settings.modelConfig.id);

            // Возвращаем задачу в очередь
            this.taskManager.taskRequeued(workerId, task);

            // Удаляем воркера
            if (this.workers[workerId]) {
                this.workers[workerId].cancel();
                delete this.workers[workerId];
            }

            // Пытаемся найти замену
            var availableKeys = this.settings.apiKeys.filter(function(key) {
                return !self.workers[key] && !self.pausedKeys.has(key);
            });

            if (availableKeys.length > 0) {
                var nextKey = availableKeys[0];
                EventBus.log('[MANAGER] 🚀 Ротация: Ключ …' + workerId.slice(-4) + ' ⮕ …' + nextKey.slice(-4), 'warning');
                this.launchWorker(nextKey, this.settings);
                EventBus.emit(EventBus.EVENTS.WORKER_ROTATED, {
                    oldWorkerId: workerId,
                    newWorkerId: nextKey
                }, { source: 'TranslationEngine' });
            } else {
                EventBus.log('[MANAGER] ⛔ Нет доступных ключей для замены …' + workerId.slice(-4), 'error');
            }

            this.processNextTasks();
        },

        /**
         * Обработка временного лимита
         */
        handleTemporaryLimit: function(workerId, task, delay) {
            var self = this;

            EventBus.log('Ключ …' + workerId.slice(-4) + ' на паузе на ' + delay + ' сек', 'warning');

            // Увеличиваем счетчик предупреждений
            this.keyWarningCounters[workerId] = (this.keyWarningCounters[workerId] || 0) + 1;

            if (this.keyWarningCounters[workerId] >= MAX_REPEATED_WARNINGS) {
                this.handleQuotaExceeded(workerId, task);
                return;
            }

            // Ставим ключ на паузу
            this.pausedKeys.add(workerId);
            this.taskManager.taskRequeued(workerId, task);

            EventBus.emit(EventBus.EVENTS.TEMPORARY_LIMIT_WARNING, {
                workerId: workerId,
                delay: delay
            }, { source: 'TranslationEngine' });

            // Снимаем паузу через delay секунд
            setTimeout(function() {
                self.pausedKeys.delete(workerId);
                EventBus.log('Ключ …' + workerId.slice(-4) + ' снят с паузы', 'info');
                self.processNextTasks();
            }, delay * 1000);
        },

        /**
         * Сохранение результата
         */
        saveResult: function(task, result) {
            if (!result) return;

            var taskType = task[0];

            if ((taskType === 'epub' || taskType === 'epub_chunk') && result.result) {
                EventBus.emit(EventBus.EVENTS.TRANSLATION_SAVED, {
                    task: task,
                    content: result.result,
                    originalPath: result.originalPath || task[2]
                }, { source: 'TranslationEngine', sessionId: this.sessionId });
            }

            if (taskType === 'glossary_batch_task' && result.result) {
                // Слияние новых терминов
                var mode = this.settings.glossaryAiMode || 'supplement';
                this.sessionGlossary = GlossaryManager.Aggregator.merge(this.sessionGlossary, result.result, mode);
                
                EventBus.log('Обработан пакет глоссария. Накоплено терминов: ' + this.sessionGlossary.length, 'info');
            }
        },

        /**
         * Проверка завершения
         */
        checkFinished: function() {
            if (!this.taskManager) return;

            if (this.taskManager.isFinished() || this.isCancelled) {
                this.finish(this.isCancelled ? 'Отменено' : 'Завершено');
            }
        },

        /**
         * Завершение сессии
         */
        finish: function(reason) {
            if (!this.isRunning) return;

            this.isRunning = false;

            // Останавливаем мониторинг
            if (this.monitorInterval) {
                clearInterval(this.monitorInterval);
                this.monitorInterval = null;
            }

            // Останавливаем всех воркеров
            Object.values(this.workers).forEach(function(worker) {
                worker.cancel();
            });
            this.workers = {};

            var summary = {
                completed: this.completedTasks,
                failed: this.failedTasks,
                total: this.totalTasks
            };

            EventBus.log('◀◀◀ Сессия завершена: ' + reason, 'success');
            EventBus.log('Выполнено: ' + summary.completed + '/' + summary.total + 
                        (summary.failed > 0 ? ' (ошибок: ' + summary.failed + ')' : ''), 'info');

            // Если за сессию был сгенерирован глоссарий, отправляем его
            if (this.sessionGlossary && this.sessionGlossary.length > 0) {
                EventBus.emit(EventBus.EVENTS.GLOSSARY_GENERATION_FINISHED, {
                    glossary: this.sessionGlossary
                }, { source: 'TranslationEngine', sessionId: this.sessionId });
            }

            EventBus.emit(EventBus.EVENTS.SESSION_FINISHED, {
                sessionId: this.sessionId,
                reason: reason,
                summary: summary
            }, { source: 'TranslationEngine' });

            this.sessionId = null;
            this.taskManager = null;
            this.sessionGlossary = [];
        },

        /**
         * Остановка сессии
         */
        stop: function(reason) {
            this.isCancelled = true;
            reason = reason || 'Остановлено';

            if (this.taskManager) {
                this.taskManager.clearPendingQueues();
            }

            this.finish(reason);
        },

        /**
         * Пауза/Возобновление
         */
        togglePause: function() {
            this.isPaused = !this.isPaused;

            if (!this.isPaused) {
                this.processNextTasks();
            }

            return this.isPaused;
        },

        /**
         * Получение статуса
         */
        getStatus: function() {
            return {
                isRunning: this.isRunning,
                isPaused: this.isPaused,
                sessionId: this.sessionId,
                completed: this.completedTasks,
                failed: this.failedTasks,
                total: this.totalTasks,
                pending: this.taskManager ? this.taskManager.getPendingCount() : 0
            };
        }
    };

    // Синглтон
    var engineInstance = null;

    function getEngine() {
        if (!engineInstance) {
            engineInstance = new Engine();
        }
        return engineInstance;
    }

    // Публичный API
    return {
        getEngine: getEngine,
        TranslationWorker: TranslationWorker
    };
})();

    /**

     */

        elements.btnSelectFile.addEventListener('click', function() {
            elements.fileInput.click();
        });

        if (elements.fileInput) {
            elements.fileInput.addEventListener('change', function(e) { handleFileSelect(e); });
        }

        if (elements.fileDropZone) {
            elements.fileDropZone.addEventListener('dragover', function(e) {
                e.preventDefault();
                e.stopPropagation();
                this.classList.add('drag-over');
            });

            elements.fileDropZone.addEventListener('dragleave', function(e) {
                e.preventDefault();
                e.stopPropagation();
                this.classList.remove('drag-over');
            });

            elements.fileDropZone.addEventListener('drop', function(e) { handleFileDrop(e); });
        }

        if (elements.btnClearFile) {
            elements.btnClearFile.addEventListener('click', function() { clearFile(); });
        }

        // Chapter selection
        if (elements.btnSelectAll) {
            elements.btnSelectAll.addEventListener('click', function() { selectChapters('all'); });
        }
        if (elements.btnDeselectAll) {
            elements.btnDeselectAll.addEventListener('click', function() { selectChapters('none'); });
        }
        if (elements.btnInvertSelection) {
            elements.btnInvertSelection.addEventListener('click', function() { selectChapters('invert'); });
        }

        // API settings
        if (elements.apiProvider) {
            elements.apiProvider.addEventListener('change', function() { updateProviderModels(); });
        }
        if (elements.apiModel) {
            elements.apiModel.addEventListener('change', function() { updateThinkingOptions(); });

        if (elements.temperature) {

                elements.fuzzyThresholdValue.textContent = this.value;
            });
        }

        // Thinking mode
        if (elements.thinkingEnabled) {
            elements.thinkingEnabled.addEventListener('change', function() {
                if (elements.thinkingBudgetWrapper) {
                    elements.thinkingBudgetWrapper.style.display = this.checked ? 'block' : 'none';
                }
            });
        }

        // Mobile panel tabs
        if (elements.mobilePanelTabs) {
            elements.mobilePanelTabs.forEach(function(tab) {
                tab.addEventListener('click', function() {
                    switchMobilePanel(this.dataset.panel);
                });
            });
        }

        // Prompt
        if (elements.promptPreset) {
            elements.promptPreset.addEventListener('change', function() { loadPromptPreset(); });

        if (elements.btnDeletePrompt) {

        // Translation control
        if (elements.btnStartTranslation) {
            elements.btnStartTranslation.addEventListener('click', function() { startTranslation(); });
